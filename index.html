    <style>

            --bg-retail: #000000;
            --card-retail: #111111;
            --header-retail: rgba(12, 12, 12, 0.95);
            --footer-retail: rgba(12, 12, 12, 0.95);

            --royal-blue-gradient: radial-gradient(circle at center, #1856c8 0%, #0b3fa8 50%, #031d5c 100%);
            --card-wholesale: rgba(11, 45, 110, 0.45);
            --header-wholesale: rgba(3, 29, 92, 0.95);
            --footer-wholesale: rgba(3, 29, 92, 0.98);

            --gold-gradient: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            --gold-solid: #d4af37;
            --pink-love: #ff2a85;
            --pink-discount: #ff2a85;
            --text-white: #ffffff;
            --text-gray: #b0b0b0;
            --font-main: 'Poppins', sans-serif;
        }

        html, body { 
            width: 100%; max-width: 100%; overflow-x: hidden; 
            background: var(--bg-retail) !important; 
            color: var(--text-white); font-family: var(--font-main); 
            min-height: 100vh; transition: background 0.4s ease;
        }
        body { padding-top: 85px; padding-bottom: 90px; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body.wholesale-mode { background: var(--royal-blue-gradient) !important; background-attachment: fixed !important; }
        body.wholesale-mode .product-card { background: var(--card-wholesale) !important; border-color: rgba(212, 175, 55, 0.35) !important; backdrop-filter: blur(10px); }
        body.wholesale-mode header.app-header { background: var(--header-wholesale) !important; }
        body.wholesale-mode nav.bottom-nav { background: var(--footer-wholesale) !important; }
        body.wholesale-mode .category-fullscreen-view,
        body.wholesale-mode .fullscreen-portal-view,
        body.wholesale-mode .subdomain-iframe-overlay,
        body.wholesale-mode #productDetailModal,
        body.wholesale-mode #localYouModal { background: var(--royal-blue-gradient) !important; }

        header.app-header {
            display: flex; flex-direction: column; padding: 6px 10px; align-items: center;
            background: var(--header-retail); position: fixed; top: 0; left: 0; z-index: 1000;
            backdrop-filter: blur(15px); width: 100%; border-bottom: 1px solid rgba(212,175,55,0.15); gap: 5px;
        }
        .header-top-bar { display: flex; justify-content: center; align-items: center; width: 100%; max-width: 600px; padding: 2px 4px; }
        .header-center-group { display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; }
        .brand-logo-img { width: 24px; height: 24px; object-fit: contain; }
        .brand-title-main { font-size: 0.85rem; font-weight: 900; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; letter-spacing: 1px; }
        .dynamic-flag-img { width: 18px; height: 12px; object-fit: cover; border-radius: 2px; }

        .header-bottom-row { display: flex; justify-content: center; align-items: center; width: 100%; max-width: 600px; gap: 6px; }
        .header-buttons-group { display: flex; align-items: center; gap: 5px; width: 100%; justify-content: center; }
        
        .portal-btn {
            font-size: 0.52rem; font-weight: 700; background: #161616; border: 1px solid rgba(212,175,55,0.3);
            color: var(--text-white); padding: 7px 8px; border-radius: 5px; text-transform: uppercase; cursor: pointer;
            transition: 0.3s; white-space: nowrap; text-align: center; flex: 1; display: flex; align-items: center; justify-content: center;
        }
        .portal-btn.wholesale-btn { background: var(--gold-gradient); color: #000; border: none; font-weight: 900; }
        .portal-btn.wholesale-active { background: #161616 !important; color: var(--gold-solid) !important; border: 1px solid var(--gold-solid) !important; }

        .live-chat-widget {
            position: fixed; bottom: 70px; right: 20px; z-index: 3500; cursor: grab;
            width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; background: none; touch-action: none;
        }
        .live-chat-widget i { font-size: 1.8rem; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .feed-container { padding: 12px 10px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 100%; max-width: 1400px; margin: 0 auto; }

        .product-card {
            background: var(--card-retail); border-radius: 12px; overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.85); display: flex; flex-direction: column; transition: 0.3s; position: relative;
            border: 1px solid rgba(212, 175, 55, 0.15);
        }
        .product-media-box { position: relative; width: 100%; cursor: pointer; background: #000; overflow: hidden; aspect-ratio: 1/1; }
        .product-media-box img { width: 100%; height: 100%; display: block; object-fit: cover; }
        .card-footer-actions { display: flex; justify-content: center; align-items: center; padding: 10px; background: rgba(15, 15, 15, 0.95); }
        .love-share-group { display: flex; align-items: center; gap: 20px; justify-content: center; width: 100%; }
        
        .love-action { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 0.75rem; font-weight: 700; color: var(--pink-love); }
        .love-action i { font-size: 0.95rem; background: var(--pink-love); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .share-action-btn { display: flex; align-items: center; gap: 6px; background: none; border: none; font-size: 0.75rem; font-weight: 700; cursor: pointer; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .fullscreen-portal-view, .subdomain-iframe-overlay, .category-fullscreen-view, #productDetailModal, #localYouModal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 5000; overflow-y: auto;
        }
        .category-fullscreen-view { z-index: 4000; background: var(--bg-retail); padding: 20px 12px 90px 12px; }
        #productDetailModal, #localYouModal { z-index: 5000; background: var(--bg-retail); padding: 15px 10px 80px 10px; }
        .product-details-content { padding: 4px; max-width: 440px; margin: 25px auto 0 auto; display: flex; flex-direction: column; gap: 8px; }

        /* লাক্সারি ঝুড়ি ও চেকআউট প্যানেল (কম্পিউটার ও মোবাইলে সুন্দর ফিট করার জন্য max-width ও padding অপ্টিমাইজড) */
        .local-you-box {
            max-width: 440px; width: 92%; margin: 30px auto; background: #0c0c0c; border: 1px solid rgba(212,175,55,0.35);
            border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.9);
        }
        .cart-items-preview-box {
            background: #141414; border: 1px solid rgba(212,175,55,0.2); border-radius: 8px; padding: 8px; max-height: 190px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px;
        }
        .cart-item-row {
            display: flex; align-items: center; justify-content: space-between; background: #1a1a1a; padding: 6px 8px; border-radius: 6px; border: 1px solid rgba(212,175,55,0.1); gap: 8px;
        }
        .cart-item-img { width: 34px; height: 34px; object-fit: cover; border-radius: 4px; border: 1px solid var(--gold-solid); }
        .cart-item-info { flex: 1; display: flex; flex-direction: column; text-align: left; }
        .cart-item-title { font-size: 0.6rem; font-weight: 700; color: #fff; }
        .cart-item-qty-price { font-size: 0.52rem; color: var(--text-gray); }
        .cart-item-delete { background: none; border: none; color: #ff2a85; cursor: pointer; font-size: 0.8rem; padding: 4px; }

        #checkoutFormSection { display: none; flex-direction: column; gap: 8px; }

        .form-group-item { display: flex; flex-direction: column; gap: 3px; text-align: left; }
        .form-group-item label { font-size: 0.55rem; font-weight: 700; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; }
        .form-group-item input, .form-group-item select, .form-group-item textarea {
            background: #141414; border: 1px solid rgba(212,175,55,0.3); padding: 8px 10px; border-radius: 6px;
            color: #fff; font-size: 0.7rem; outline: none; font-family: var(--font-main); width: 100%;
        }
        .google-verify-btn {
            background: var(--gold-gradient); color: #000; font-weight: 900; font-size: 0.65rem; padding: 10px; border-radius: 6px;
            border: none; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; text-transform: uppercase;
        }
        .phone-input-row { display: grid; grid-template-columns: 100px 1fr; gap: 6px; }

        .golden-close-btn {
            background: #141414; border: 1px solid rgba(212,175,55,0.4); width: 36px; height: 36px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; cursor: pointer; position: fixed; top: 15px; right: 15px; z-index: 99999;
        }
        .golden-close-btn i { font-size: 1.1rem; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .media-slider-container { width: 100%; position: relative; border-radius: 8px; overflow: hidden; background: #000; }
        .main-display-media { width: 100%; height: 210px; object-fit: contain; display: block; background: #000; }
        .thumbnail-strip { display: flex; justify-content: center; gap: 5px; padding: 4px; background: #0c0c0c; overflow-x: auto; }
        .thumb-item { width: 38px; height: 38px; border-radius: 4px; overflow: hidden; border: 1.5px solid rgba(212,175,55,0.3); cursor: pointer; flex-shrink: 0; }
        .thumb-item img { width: 100%; height: 100%; object-fit: cover; }
        .thumb-item.active { border-color: var(--gold-solid); }

        .price-chat-row { display: flex; justify-content: space-between; align-items: center; gap: 6px; background: #111111; padding: 8px 10px; border-radius: 6px; }
        .detail-price { font-size: 1.05rem; font-weight: 900; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .discount-badge-btn { background: var(--pink-discount); color: #fff; font-size: 0.52rem; font-weight: 800; padding: 5px 8px; border-radius: 5px; border: none; display: flex; align-items: center; gap: 3px; }
        .chat-with-seller-btn { background: var(--gold-gradient); color: #000; font-size: 0.55rem; font-weight: 800; padding: 6px 10px; border-radius: 5px; border: none; cursor: pointer; }

        .product-title-bottom { font-size: 0.8rem; font-weight: 900; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; text-align: center; }
        .desc-size-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
        .extra-action-btn { background: #161616; border: 1px solid rgba(212,175,55,0.3); color: #fff; font-size: 0.58rem; font-weight: 700; padding: 7px; border-radius: 6px; cursor: pointer; text-align: center; text-transform: uppercase; }

        .quantity-tier-container { display: flex; flex-direction: column; gap: 6px; }
        .wholesale-tiers-row { display: none; gap: 5px; }
        .wholesale-mode-active .wholesale-tiers-row { display: grid; grid-template-columns: repeat(3, 1fr); }
        .tier-btn { background: #161616; border: 1px solid rgba(212,175,55,0.3); color: #fff; font-size: 0.45rem; font-weight: 700; padding: 6px 2px; border-radius: 6px; cursor: pointer; text-align: center; }
        .tier-btn.active { background: var(--gold-gradient); color: #000; font-weight: 900; border: none; }

        .quantity-row { display: flex; flex-direction: column; align-items: center; gap: 3px; }
        .qty-box { display: flex; align-items: center; justify-content: center; gap: 15px; width: 100%; }
        .qty-btn { background: var(--gold-gradient); border: none; color: #000; font-size: 1.1rem; font-weight: 900; cursor: pointer; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .qty-display { font-size: 1rem; font-weight: 900; color: #fff; min-width: 35px; text-align: center; }
        
        .order-now-btn { background: var(--gold-gradient); color: #000; font-weight: 900; font-size: 0.72rem; padding: 11px; border-radius: 6px; border: none; cursor: pointer; width: 100%; text-transform: uppercase; }

        .category-section { padding: 14px 8px; }
        .category-header-row { display: flex; justify-content: flex-start; align-items: center; margin-bottom: 12px; padding: 0 4px; }
        .category-title { font-size: 0.9rem; font-weight: 800; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; }
        
        .app-store-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 100%; }
        @media (min-width: 576px) { .app-store-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (min-width: 768px) { .app-store-grid { grid-template-columns: repeat(5, 1fr); gap: 12px; } }

        .app-card { background: #131315; border-radius: 10px; border: 1px solid rgba(255,255,255,0.04); padding: 14px 10px; display: flex; align-items: center; cursor: pointer; gap: 12px; min-height: 70px; }
        .app-card:hover { background: #1a1a1e; border-color: rgba(212, 175, 55, 0.3); }
        .app-card-icon i { font-size: 1.3rem; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .app-card-name { font-size: 0.7rem; font-weight: 600; color: var(--text-white); text-transform: uppercase; }

        /* বটম ন্যাভবার ও নোটিফিকেশন ব্যাজ ফিক্সড (আইকনের ঠিক উপরে সুন্দরভাবে সেট করা) */
        nav.bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%; background: var(--footer-retail);
            display: flex; justify-content: space-around; align-items: center; padding: 8px 4px;
            z-index: 6500; border-top: 1px solid rgba(212,175,55,0.15); backdrop-filter: blur(15px);
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; text-decoration: none;
            color: var(--text-gray); font-size: 0.6rem; font-weight: 700; cursor: pointer; text-align: center; gap: 3px; flex: 1; position: relative;
        }
        .nav-item i { font-size: 1.15rem; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-item span { text-transform: uppercase; }
        
        .cart-badge {
            position: absolute; top: -3px; right: 30%; background: #ff2a85; color: #fff;
            font-size: 0.52rem; font-weight: 900; width: 16px; height: 16px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; border: 1.5px solid #000;
            box-shadow: 0 2px 6px rgba(0,0,0,0.8); z-index: 20;
        }

        .search-popup-box { display: none; position: fixed; top: 75px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 520px; z-index: 4000; }
        .search-input-field-box { display: flex; align-items: center; background: #000000; border: 1px solid rgba(212,175,55,0.4); border-radius: 30px; padding: 6px 14px; gap: 10px; }
        .search-input-field-box input { background: none; border: none; outline: none; color: #fff; font-size: 0.85rem; width: 100%; }
        .search-submit-btn { background: var(--gold-gradient); border: none; color: #000; font-weight: 800; font-size: 0.65rem; padding: 5px 12px; border-radius: 20px; cursor: pointer; }
    </style>
</head>
<body id="mainBody">

    <header class="app-header" id="mainHeader">
        <div class="header-top-bar">
            <div class="header-center-group" onclick="location.href='https://rorraxy.com'">
                <img src="https://lh3.googleusercontent.com/d/1qyOXxZ8s2cJMEo66NDE4BdoxiC4hy_sG" alt="Logo" class="brand-logo-img">
                <span class="brand-title-main">RORRAXY</span>
                <div class="header-country-flag-box" id="visitorCountryBox">
                    <img id="visitorFlagImg" src="https://flagcdn.com/w80/bd.png" alt="Flag" class="dynamic-flag-img">
                </div>
            </div>
        </div>
        <div class="header-bottom-row">
            <div class="header-buttons-group">
                <button class="portal-btn" onclick="openFullScreenPortal('https://academy.rorraxy.com')">Creative Academy</button>
                <button class="portal-btn" onclick="openFullScreenPortal('https://solutions.rorraxy.com')">B2B/B2C Solution</button>
                <button class="portal-btn wholesale-btn" id="wholesaleToggleBtn" onclick="toggleRetailWholesaleMode()">Wholesale</button>
            </div>
        </div>
    </header>

    <div class="live-chat-widget" id="draggableChat" onclick="openLiveChat()" title="Live Chat">
        <i class="fa-solid fa-comments"></i>
    </div>

    <!-- Feed Layout -->
    <main class="feed-container" id="productFeed">
        <div class="product-card" id="card-prod-1">
            <div class="product-media-box" onclick="openProductDetails('PREMIUM BRACELET', '$100.00', ['https://0d2bc64b36fe70d346646a8bf8bfd5a.r2.cloudflarestorage.com/bracelet-1.jpg', 'https://lh3.googleusercontent.com/d/1qyOXxZ8s2cJMEo66NDE4BdoxiC4hy_sG'])">
                <img src="https://0d2bc64b36fe70d346646a8bf8bfd5a.r2.cloudflarestorage.com/bracelet-1.jpg" alt="Product Optimized R2" onerror="this.src='https://lh3.googleusercontent.com/d/1a6lFxluTSYUQjB8oqlVQYApRRSmCxEOW'">

            <div class="card-footer-actions">

                    </div>
                    <button class="share-action-btn" onclick="openShareModal()">
                        <i class="fa-solid fa-share-nodes"></i> Share
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- ফুল-স্ক্রিন ওভারলে ভিউ -->
    <div id="fullScreenPortal" class="fullscreen-portal-view">
        <div class="golden-close-btn" onclick="closeFullScreenPortal()"><i class="fa-solid fa-xmark"></i></div>
        <iframe id="fullScreenIframe" src="" style="width: 100vw; height: 100vh; border: none; background: #000;"></iframe>
    </div>

    <!-- সাব-ডোমেইন ওভারলে -->
    <div id="subdomainOverlay" class="subdomain-iframe-overlay">

    </div>

    <!-- লাক্সারি ঝুড়ি ও সিকিউর চেকআউট প্যানেল -->
    <div id="localYouModal">
        <div class="golden-close-btn" onclick="closeLocalYouPanel()"><i class="fa-solid fa-xmark"></i></div>
        <div class="local-you-box">
            <div style="text-align:center;">
                <i class="fa-solid fa-cart-shopping" style="font-size:1.3rem; color:var(--gold-solid);"></i>
                <h3 style="background:var(--gold-gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent; font-size:0.8rem; margin-top:3px; text-transform:uppercase;">Cart & Secure Checkout</h3>
            </div>
            
            <!-- ঝুড়িতে থাকা প্রোডাক্টগুলোর তালিকা (ছবিসহ ও ডিলিট অপশন) -->
            <div id="cartItemsPreviewBox" class="cart-items-preview-box">
                <!-- JS Inject Cart Items -->
            </div>

            <!-- সিকোয়েন্স অনুযায়ী প্রথমে শুধু গুগল ভেরিফাই বাটন থাকবে -->
            <button class="google-verify-btn" id="googleVerifyBtn" onclick="simulateGoogleAuth()">
                <i class="fa-brands fa-google" style="color:#000;"></i> Continue & Verify with Google
            </button>

            <!-- গুগল ভেরিফাই করার পর চেকআউট ফর্ম এবং কনফার্ম অর্ডার বাটন আসবে -->
            <div id="checkoutFormSection">
                <div class="form-group-item">
                    <label>Full Name</label>
                    <input type="text" id="checkoutFullName" placeholder="Enter your full name">
                </div>

                <div class="form-group-item">
                    <label>Gmail Address</label>
                    <input type="email" id="checkoutEmail" placeholder="user@gmail.com">
                </div>

                <div class="form-group-item">
                    <label>WhatsApp Number (195+ Countries)</label>
                    <div class="phone-input-row">
                        <select id="countryCodeSelect">

        function updateCartBadge() {
            let cart = JSON.parse(localStorage.getItem('rorraxy_cart')) || [];
            let totalQty = cart.reduce((sum, item) => sum + (item.qty || 1), 0);
            let badge = document.getElementById('cartCountBadge');
            badge.innerText = totalQty;
            badge.style.display = totalQty > 0 ? 'flex' : 'none';
        }

        window.onload = function() {
            updateCartBadge();
            fetch('https://ipapi.co/json/').then(r => r.json()).then(d => {
                let cc = d.country_code ? d.country_code.toLowerCase() : 'bd';
                document.getElementById('visitorFlagImg').src = `https://flagcdn.com/w80/${cc}.png`;
            }).catch(() => {});
        };

        function openFullScreenPortal(url) {
            closeAllPanels();

        function toggleSubdomainOverlay(url) {
            const overlay = document.getElementById('subdomainOverlay');
            const iframe = document.getElementById('subdomainIframeElement');
            if (overlay.style.display === 'flex' && activeSubdomainUrl === url) {
                closeSubdomainOverlay();
                return;
            }
            closeAllPanels();
            activeSubdomainUrl = url;
            iframe.src = url;
            overlay.style.display = 'flex';
        }
        function closeSubdomainOverlay() {
            document.getElementById('subdomainOverlay').style.display = 'none';
            document.getElementById('subdomainIframeElement').src = '';
            activeSubdomainUrl = "";

        // ঝুড়ির ভেতরে প্রোডাক্টগুলোর তালিকা, ছবি, ডিলিট অপশন এবং টোটাল অ্যামাউন্ট রেন্ডার করা
        function renderCartInYouPanel() {
            let cart = JSON.parse(localStorage.getItem('rorraxy_cart')) || [];
            let container = document.getElementById('cartItemsPreviewBox');
            if(cart.length === 0) {
                container.innerHTML = '<div style="color:var(--text-gray); text-align:center; font-size:0.65rem; padding:12px;">Your Cart is empty.</div>';
                return;
            }
            let html = '', totalAmt = 0;
            cart.forEach((item, index) => {
                let priceNum = parseFloat(item.price.replace('$', ''));
                let itemTotal = priceNum * item.qty;
                totalAmt += itemTotal;
                html += `
                <div class="cart-item-row">
                    <img src="${item.img}" class="cart-item-img" onerror="this.src='https://lh3.googleusercontent.com/d/1a6lFxluTSYUQjB8oqlVQYApRRSmCxEOW'">
                    <div class="cart-item-info">
                        <span class="cart-item-title">${item.title}</span>
                        <span class="cart-item-qty-price">Qty: ${item.qty} | $${itemTotal.toFixed(2)}</span>
                    </div>
                    <button class="cart-item-delete" onclick="removeCartItem(${index})" title="Delete Item"><i class="fa-solid fa-trash-can"></i></button>
                </div>`;
            });
            html += `
            <div style="display:flex; justify-content:space-between; margin-top:4px; border-top:1px solid rgba(212,175,55,0.3); padding-top:5px;">
                <span style="font-size:0.7rem; font-weight:bold;">Total Amount:</span>
                <span style="font-size:0.75rem; font-weight:900; background:var(--gold-gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">$${totalAmt.toFixed(2)}</span>
            </div>`;
            container.innerHTML = html;
        }

        function removeCartItem(index) {
            let cart = JSON.parse(localStorage.getItem('rorraxy_cart')) || [];
            cart.splice(index, 1);
            localStorage.setItem('rorraxy_cart', JSON.stringify(cart));
            updateCartBadge();
            renderCartInYouPanel();
        }

            const discountText = document.getElementById('modalDiscountText');

            isWholesaleMode = !isWholesaleMode;
            document.body.classList.toggle('wholesale-mode');

            if (isWholesaleMode) {
                qtyContainer.classList.add('wholesale-mode-active');
                toggleBtn.innerText = "Retail Mode";
                toggleBtn.classList.add('wholesale-active');
                discountText.innerText = "0% OFF";
                setWholesaleTier(1, 100, null);
            } else {
                qtyContainer.classList.remove('wholesale-mode-active');
                toggleBtn.innerText = "Wholesale";
                toggleBtn.classList.remove('wholesale-active');
                discountText.innerText = "5% OFF";
                currentQuantity = 1;
                baseUnitPrice = 100.00;
                document.getElementById('productQtyDisplay').innerText = currentQuantity;
                updateCalculatedPrice();
            }
        }

        function adjustQuantity(amount) {
            currentQuantity += amount;
            if (currentQuantity < 1) currentQuantity = 1;
            document.getElementById('productQtyDisplay').innerText = currentQuantity;
            updateCalculatedPrice();
        }

        function setWholesaleTier(qty, unitPrice, eventObj) {
            currentQuantity = qty;
            baseUnitPrice = unitPrice;
            document.getElementById('productQtyDisplay').innerText = currentQuantity;
            updateCalculatedPrice();
            if(eventObj) {
                document.querySelectorAll('.tier-btn').forEach(btn => btn.classList.remove('active'));
                eventObj.target.classList.add('active');
            }
        }

        function updateCalculatedPrice() {
            let finalPrice = baseUnitPrice * currentQuantity;
            document.getElementById('modalProductPrice').innerText = `$${finalPrice.toFixed(2)}`;
        }

        }

        // সার্চ পপআপ টগল সিস্টেম
        function toggleSearchPopup() {
            const popup = document.getElementById('searchPopup');
            if (popup.style.display === 'block') {
                popup.style.display = 'none';
            } else {
                closeAllPanels();
                popup.style.display = 'block';
            }
        }
        function executeSearch() { document.getElementById('searchPopup').style.display = 'none'; }

        function toggleLove(el) { el.classList.toggle('gold-active'); }
        function toggleModalLove(el) { el.classList.toggle('gold-active'); }

        function openProductDetails(title, price, images) {
            currentQuantity = 1;
            baseUnitPrice = parseFloat(price.replace('$', ''));
            currentProductImg = images[0];
            document.getElementById('productQtyDisplay').innerText = currentQuantity;
            document.getElementById('mainDisplayMedia').src = images[0];
            document.getElementById('modalProductPrice').innerText = price;
            document.getElementById('modalProductTitle').innerText = title;
            
            let thumbHTML = '';
            images.forEach((img, index) => {
                thumbHTML += `<div class="thumb-item ${index === 0 ? 'active' : ''}" onclick="switchMedia('${img}', this)"><img src="${img}"></div>`;
            });
            document.getElementById('thumbStrip').innerHTML = thumbHTML;
            document.getElementById('productDetailModal').style.display = 'block';
        }

        function closeProductDetails() { document.getElementById('productDetailModal').style.display = 'none'; }
        
        function switchMedia(src, element) {
            currentProductImg = src;
            document.getElementById('mainDisplayMedia').src = src;
            document.querySelectorAll('.thumb-item').forEach(t => t.classList.remove('active'));
            element.classList.add('active');
        }
        function chatWithSeller() {}

        function openShareModal() {
            let baseUrl = window.location.href.split('?')[0];
            document.getElementById('shareUrlInput').value = baseUrl;
            document.getElementById('shareModal').style.display = 'flex';
        }
        function closeShareModal() { document.getElementById('shareModal').style.display = 'none'; }

        // "Order Now" ক্লিক করলে পপআপ বন্ধ হবে এবং প্রোডাক্ট কার্টে জমা হয়ে ব্যাজ আপডেট হবে
        function triggerOrderNow(event) {
            let title = document.getElementById('modalProductTitle').innerText;
            let price = document.getElementById('modalProductPrice').innerText;
            let imgSrc = currentProductImg || 'https://0d2bc64b36fe70d346646a8bf8bfd5a.r2.cloudflarestorage.com/bracelet-1.jpg';
            
            let cart = JSON.parse(localStorage.getItem('rorraxy_cart')) || [];
            cart.push({ title: title, price: price, qty: currentQuantity, img: imgSrc, addedAt: new Date().toISOString() });
            localStorage.setItem('rorraxy_cart', JSON.stringify(cart));
            
            updateCartBadge();
            document.getElementById('productDetailModal').style.display = 'none';
        }

        // ফাইনাল অর্ডার কনফার্ম ও ফায়ারবেসে ডেটা পাঠানো
        async function finalizeDirectOrder() {
            let cart = JSON.parse(localStorage.getItem('rorraxy_cart')) || [];
            if(cart.length === 0) { alert("Your cart is empty!"); return; }

            let fullName = document.getElementById('checkoutFullName').value;
            let email = document.getElementById('checkoutEmail').value;
            let countryCode = document.getElementById('countryCodeSelect').value;
            let phone = document.getElementById('whatsappNum').value;
            let address = document.getElementById('checkoutAddress').value;

            if(!fullName || !email || !phone || !address) {
                alert("Please fill in all the required fields!");
                return;
            }

            try {
                if(window.RorraxyDB && window.RorraxyAddDoc) {
                    await window.RorraxyAddDoc(window.RorraxyCollection(window.RorraxyDB, "rorraxy_orders"), {
                        fullName: fullName,
                        email: email,
                        whatsapp: countryCode + " " + phone,
                        address: address,
                        cartItems: cart,
                        timestamp: new Date().toISOString()
                    });
                }
                alert("Order placed and verified successfully via Firebase!");
                localStorage.removeItem('rorraxy_cart');
                updateCartBadge();
                closeLocalYouPanel();
            } catch(e) {
                alert("Order saved locally. Firebase sync note: " + e.message);
                localStorage.removeItem('rorraxy_cart');
                updateCartBadge();
                closeLocalYouPanel();
            }
        }
    </script>
