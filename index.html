    <!-- প্রফেশনাল ভিআইপি স্মুথ সাউন্ড জেনারেটর -->
    <script>
        function playVipSmoothSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.15);
                
                gainNode.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
                
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.35);
            } catch(e) {}
        }
    </script>

    <script>
        let isWholesaleMode = false;
        let currentQuantity = 1;
        let baseUnitPrice = 100.00;
        let activeSubdomainUrl = "";
        let currentProductMedia = "";
        let selectedProductSize = "Medium";
        let currentMediaList = [];
        let visitorCountryCode = "bd";

        function closeAllPanels() {
            document.getElementById('subdomainOverlay').style.display = 'none';
            document.getElementById('subdomainIframeElement').src = '';
            activeSubdomainUrl = "";
            document.getElementById('localYouModal').style.display = 'none';
            document.getElementById('categoryView').style.display = 'none';
            document.getElementById('searchPopup').style.display = 'none';
            document.getElementById('productDetailModal').style.display = 'none';
            document.getElementById('shareModal').style.display = 'none';
            document.getElementById('infoPopupModal').style.display = 'none';
        }

        function updateCartBadge() {
            let cart = JSON.parse(localStorage.getItem('rorraxy_cart')) || [];
            let totalQty = cart.reduce((sum, item) => sum + (item.qty || 1), 0);
            let badge = document.getElementById('cartCountBadge');
            badge.innerText = totalQty;
            badge.style.display = totalQty > 0 ? 'flex' : 'none';
        }

        window.onload = function() {
            closeAllPanels();
            updateCartBadge();
            let baseLikes = 343 + Math.floor(Math.random() * 150);
            document.querySelectorAll('.love-count').forEach(el => el.innerText = baseLikes);
            document.querySelectorAll('.modal-love-count').forEach(el => el.innerText = baseLikes);

            fetch('https://ipapi.co/json/').then(r => r.json()).then(d => {
                if(d.country_code) {
                    visitorCountryCode = d.country_code.toLowerCase();
                    document.getElementById('visitorFlagImg').src = `https://flagcdn.com/w80/${visitorCountryCode}.png`;
                    let modalFlag = document.getElementById('modalFlagImg');
                    if(modalFlag) modalFlag.src = `https://flagcdn.com/w80/${visitorCountryCode}.png`;
                }
            }).catch(() => {});
        };

        function openFullScreenPortal(url) {
            closeAllPanels();
            document.getElementById('fullScreenIframe').src = url;
            document.getElementById('fullScreenPortal').style.display = 'flex';
        }
        function closeFullScreenPortal() {
            document.getElementById('fullScreenPortal').style.display = 'none';
            document.getElementById('fullScreenIframe').src = '';
        }

        function toggleSubdomainOverlay(url) {
            const overlay = document.getElementById('subdomainOverlay');
            const iframe = document.getElementById('subdomainIframeElement');
            if (overlay.style.display === 'flex' && activeSubdomainUrl === url) {
                closeSubdomainOverlay();
                return;
            }
            closeAllPanels();
            activeSubdomainUrl = url;
            iframe.src = url;
            overlay.style.display = 'flex';
        }
        function closeSubdomainOverlay() {
            document.getElementById('subdomainOverlay').style.display = 'none';
            document.getElementById('subdomainIframeElement').src = '';
            activeSubdomainUrl = "";
        }

        function renderCartInYouPanel() {
            let cart = JSON.parse(localStorage.getItem('rorraxy_cart')) || [];
            let container = document.getElementById('cartItemsPreviewBox');
            if(cart.length === 0) {
                container.innerHTML = '<div style="color:var(--text-gray); text-align:center; font-size:0.8rem; padding:20px;">Your Cart is empty.</div>';
                return;
            }
            let html = '', totalAmt = 0;
            cart.forEach((item, index) => {
                let priceNum = parseFloat(item.price.replace('$', ''));
                let itemTotal = priceNum * item.qty;
                totalAmt += itemTotal;
                let modeTag = item.isWholesale ? '(Wholesale)' : '(Retail)';
                let sizeInfo = item.size ? ` | Size: ${item.size}` : '';
                let imgSrc = item.img && !item.img.includes('youtube') && !item.img.includes('embed') ? item.img : 'https://0d2bc64b36fe70d346646a8bf8bfd5a.r2.cloudflarestorage.com/bracelet-1.jpg';
                html += `
                <div class="cart-item-row">
                    <img src="${imgSrc}" class="cart-item-img" onerror="this.src='https://lh3.googleusercontent.com/d/1a6lFxluTSYUQjB8oqlVQYApRRSmCxEOW'">
                    <div class="cart-item-info">
                        <span class="cart-item-title">${item.title} <span style="color:var(--pink-love); font-weight:800;">${modeTag}</span></span>
                        <span class="cart-item-qty-price">Qty: ${item.qty}${sizeInfo} | $${itemTotal.toFixed(2)}</span>
                    </div>
                    <button class="cart-item-delete" onclick="removeCartItem(${index})" title="Delete"><i class="fa-solid fa-trash-can"></i></button>
                </div>`;
            });
            html += `
            <div style="display:flex; justify-content:space-between; margin-top:8px; padding:4px 6px;">
                <span style="font-size:0.8rem; font-weight:bold;">Total Amount:</span>
                <span style="font-size:0.95rem; font-weight:900; background:var(--gold-gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">$${totalAmt.toFixed(2)}</span>
            </div>`;
            container.innerHTML = html;
        }

        function removeCartItem(index) {
            let cart = JSON.parse(localStorage.getItem('rorraxy_cart')) || [];
            cart.splice(index, 1);
            localStorage.setItem('rorraxy_cart', JSON.stringify(cart));
            updateCartBadge();
            renderCartInYouPanel();
        }

        function toggleLocalYouPanel() {
            const modal = document.getElementById('localYouModal');
            if (modal.style.display === 'flex') {
                closeLocalYouPanel();
            } else {
                closeAllPanels();
                renderCartInYouPanel();
                document.getElementById('checkoutFormSection').style.display = 'none';
                document.getElementById('googleVerifyBtn').style.display = 'flex';
                modal.style.display = 'flex';
            }
        }
        function closeLocalYouPanel() {
            document.getElementById('localYouModal').style.display = 'none';
        }

        function simulateGoogleAuth() {
            document.getElementById('checkoutFullName').value = "Masudar Rahman";
            document.getElementById('checkoutEmail').value = "masudar.rahman@gmail.com";
            
            document.getElementById('googleVerifyBtn').style.display = 'none';
            document.getElementById('checkoutFormSection').style.display = 'flex';
        }

        function toggleRetailWholesaleMode() {
            const qtyContainer = document.getElementById('qtyTierContainer');
            const toggleBtn = document.getElementById('wholesaleToggleBtn');
            const discountBadge = document.getElementById('modalDiscountBadge');

            isWholesaleMode = !isWholesaleMode;
            document.body.classList.toggle('wholesale-mode');

            if (isWholesaleMode) {
                qtyContainer.classList.add('wholesale-mode-active');
                toggleBtn.innerText = "Retail Mode";
                toggleBtn.classList.add('wholesale-active');
                discountBadge.style.display = 'none';
                setWholesaleTier(1, 100, null);
            } else {
                qtyContainer.classList.remove('wholesale-mode-active');
                toggleBtn.innerText = "Wholesale";
                toggleBtn.classList.remove('wholesale-active');
                discountBadge.style.display = 'inline-flex';
                currentQuantity = 1;
                baseUnitPrice = 100.00;
                document.getElementById('productQtyDisplay').innerText = currentQuantity;
                updateCalculatedPrice();
            }
        }

        function adjustQuantity(amount) {
            currentQuantity += amount;
            if (currentQuantity < 1) currentQuantity = 1;
            document.getElementById('productQtyDisplay').innerText = currentQuantity;
            updateCalculatedPrice();
        }

        function setWholesaleTier(qty, unitPrice, eventObj) {
            currentQuantity = qty;
            baseUnitPrice = unitPrice;
            document.getElementById('productQtyDisplay').innerText = currentQuantity;
            updateCalculatedPrice();
            if(eventObj) {
                document.querySelectorAll('.tier-btn').forEach(btn => btn.classList.remove('active'));
                eventObj.target.classList.add('active');
            }
        }

        function updateCalculatedPrice() {
            let finalPrice = baseUnitPrice * currentQuantity;
            document.getElementById('modalProductPrice').innerText = `$${finalPrice.toFixed(2)}`;
        }

        function openProductInfoModal() {
            const titleEl = document.getElementById('infoPopupTitle');
            const bodyEl = document.getElementById('infoPopupBody');
            const modal = document.getElementById('infoPopupModal');

            titleEl.innerText = "Complete Product Info & Custom Size";
            let stockStatus = isWholesaleMode ? "5,000+ Pcs Ready in Wholesale Warehouse" : "125 Pcs In-Stock (Retail)";
            let modeTitle = isWholesaleMode ? "Wholesale Mode" : "Retail Mode";

            bodyEl.innerHTML = `
                <div style="display:flex; flex-direction:column; gap:10px;">
                    <div>
                        <strong style="color:var(--gold-solid); font-size:0.75rem;"><i class="fa-solid fa-file-lines"></i> Description:</strong>
                        <p style="margin-top:2px; color:#cfcfcf;">Crafted with supreme precision, this luxury item defines global elegance. Made from premium materials featuring high-gloss lacquer and superior durability.</p>
                    </div>
                    <div>
                        <strong style="color:var(--gold-solid); font-size:0.75rem;"><i class="fa-solid fa-ruler"></i> Custom Size Selection:</strong>
                        <div style="display:flex; gap:6px; margin-top:4px; flex-wrap:wrap;">
                            <button onclick="selectCustomSize('Medium')" style="background:#1a1a1a; border:1px solid rgba(212,175,55,0.4); color:#fff; padding:5px 8px; border-radius:4px; font-size:0.58rem; cursor:pointer;">Medium (M)</button>
                            <button onclick="selectCustomSize('Large')" style="background:#1a1a1a; border:1px solid rgba(212,175,55,0.4); color:#fff; padding:5px 8px; border-radius:4px; font-size:0.58rem; cursor:pointer;">Large (L)</button>
                        </div>
                        <input type="text" id="customSizeInputField" value="${selectedProductSize}" placeholder="Enter custom size..." style="background:#141414; border:1px solid rgba(212,175,55,0.4); padding:7px; border-radius:6px; color:#fff; font-size:0.68rem; width:100%; margin-top:6px; outline:none;">
                        <button onclick="saveCustomSizeSelection()" style="background:var(--gold-gradient); color:#000; font-weight:800; font-size:0.62rem; padding:7px; border-radius:6px; border:none; cursor:pointer; text-transform:uppercase; margin-top:6px; width:100%;">Save Size</button>
                    </div>
                    <div>

        function syncLoveCounters(newVal, isActive) {
            document.querySelectorAll('.love-count').forEach(el => el.innerText = newVal);
            document.querySelectorAll('.modal-love-count').forEach(el => el.innerText = newVal);
            document.querySelectorAll('.love-action').forEach(el => {
                if(isActive) {
                    el.classList.add('gold-active');
                } else {
                    el.classList.remove('gold-active');
                }
            });
        }

        function toggleLove(el) {
            let countSpan = el.querySelector('.love-count');
            let current = parseInt(countSpan.innerText);
            let willBeActive = !el.classList.contains('gold-active');
            let updatedVal = willBeActive ? current + 1 : current - 1;
            syncLoveCounters(updatedVal, willBeActive);
        }

        function toggleModalLove(el) {
            let countSpan = el.querySelector('.modal-love-count');
            let current = parseInt(countSpan.innerText);
            let willBeActive = !el.classList.contains('gold-active');

            syncLoveCounters(updatedVal, willBeActive);
        }

        function openProductDetails(title, price, mediaArray) {
            currentQuantity = 1;
            baseUnitPrice = parseFloat(price.replace('$', ''));
            currentMediaList = mediaArray;
            currentProductMedia = mediaArray[0];
            selectedProductSize = "Medium";

            document.getElementById('productQtyDisplay').innerText = currentQuantity;
            document.getElementById('modalProductPrice').innerText = price;
            document.getElementById('modalProductTitle').innerText = title;
            
            renderMainDisplayMedia(currentProductMedia);

            let thumbHTML = '';
            mediaArray.forEach((media, index) => {
                let isVid = media.includes('youtube') || media.includes('embed') || media.includes('youtu.be');
                let thumbContent = isVid ? `<i class="fa-brands fa-youtube" style="font-size:1rem; color:#ff0000; display:flex; align-items:center; justify-content:center; height:100%;"></i>` : `<img src="${media}">`;
                thumbHTML += `<div class="thumb-item ${index === 0 ? 'active' : ''}" onclick="switchMedia('${media}', this)">${thumbContent}</div>`;
            });
            document.getElementById('thumbStrip').innerHTML = thumbHTML;
            document.getElementById('productDetailModal').style.display = 'block';
        }

        function renderMainDisplayMedia(mediaUrl) {
            let container = document.getElementById('mainDisplayContainer');
            if (mediaUrl.includes('youtube') || mediaUrl.includes('embed') || mediaUrl.includes('youtu.be')) {
                let videoId = "";
                if (mediaUrl.includes('embed/')) {
                    videoId = mediaUrl.split('embed/')[1].split('?')[0];
                } else if (mediaUrl.includes('watch?v=')) {
                    videoId = mediaUrl.split('watch?v=')[1].split('&')[0];
                } else if (mediaUrl.includes('youtu.be/')) {
                    videoId = mediaUrl.split('youtu.be/')[1].split('?')[0];
                } else {
                    videoId = "dQw4w9WgXcQ";
                }
                
                let cleanEmbedUrl = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&mute=1&controls=0&modestbranding=1&rel=0&iv_load_policy=3&disablekb=1&loop=1&playlist=${videoId}`;
                
                container.innerHTML = `
                    <div class="video-wrapper-clean">
                        <div class="video-mask-top"></div>
                        <iframe src="${cleanEmbedUrl}" allow="autoplay; encrypted-media" allowfullscreen></iframe>
                        <div class="video-mask-bottom"></div>
                    </div>
                `;
            } else {
                container.innerHTML = `<img src="${mediaUrl}" class="main-display-media" alt="Product View" onerror="this.src='https://lh3.googleusercontent.com/d/1a6lFxluTSYUQjB8oqlVQYApRRSmCxEOW'">`;
            }
        }

        function closeProductDetails() { document.getElementById('productDetailModal').style.display = 'none'; }
        
        function switchMedia(src, element) {
            currentProductMedia = src;
            renderMainDisplayMedia(src);
            document.querySelectorAll('.thumb-item').forEach(t => t.classList.remove('active'));
            element.classList.add('active');
        }

        function shareToSocial(platform) {
            let url = encodeURIComponent("https://rorraxy.com");
            let text = encodeURIComponent("Check out this luxury collection on Rorraxy!");
            if(platform === 'whatsapp') {
                window.open(`https://api.whatsapp.com/send?text=${text}%20${url}`, '_blank');
            } else if(platform === 'facebook') {
                window.open(`https://www.facebook.com/sharer/sharer.php?u=${url}`, '_blank');
            } else if(platform === 'telegram') {
                window.open(`https://t.me/share/url?url=${url}&text=${text}`, '_blank');
            } else {
                window.open(`https://rorraxy.com`, '_blank');
            }
            toggleShareModal();
        }

        function triggerOrderNow(event) {
            let title = document.getElementById('modalProductTitle').innerText;
            let price = document.getElementById('modalProductPrice').innerText;
            let imgSrc = currentProductMedia && !currentProductMedia.includes('youtube') && !currentProductMedia.includes('embed') && !currentProductMedia.includes('youtu.be') ? currentProductMedia : 'https://0d2bc64b36fe70d346646a8bf8bfd5a.r2.cloudflarestorage.com/bracelet-1.jpg';
            
            playVipSmoothSound();

            let rect = document.getElementById('orderNowActionBtn').getBoundingClientRect();
            let navTarget = document.getElementById('navCartItem').getBoundingClientRect();

            let ghost = document.createElement('img');
            ghost.src = imgSrc;
            ghost.className = 'flying-product-ghost';
            ghost.style.left = rect.left + (rect.width / 2) - 22 + 'px';
            ghost.style.top = rect.top + (rect.height / 2) - 22 + 'px';
            document.body.appendChild(ghost);

            setTimeout(() => {
                ghost.style.left = (navTarget.left + (navTarget.width / 2) - 22) + 'px';
                ghost.style.top = (navTarget.top + 5) + 'px';
                ghost.style.transform = 'scale(0.15) rotate(360deg)';
                ghost.style.opacity = '0.2';
            }, 30);

            setTimeout(() => {
                ghost.remove();
            }, 720);

            let cart = JSON.parse(localStorage.getItem('rorraxy_cart')) || [];
            cart.push({ title: title, price: price, qty: currentQuantity, size: selectedProductSize, img: imgSrc, isWholesale: isWholesaleMode, addedAt: new Date().toISOString() });
            localStorage.setItem('rorraxy_cart', JSON.stringify(cart));
            
            updateCartBadge();
            document.getElementById('productDetailModal').style.display = 'none';
        }

        async function finalizeDirectOrder() {
            let cart = JSON.parse(localStorage.getItem('rorraxy_cart')) || [];
            if(cart.length === 0) { alert("Your cart is empty!"); return; }

            let fullName = document.getElementById('checkoutFullName').value;
            let email = document.getElementById('checkoutEmail').value;
            let countryCode = document.getElementById('countryCodeSelect').value;
            let phone = document.getElementById('whatsappNum').value;
            let address = document.getElementById('checkoutAddress').value;

            if(!fullName || !email || !phone || !address) {
                alert("Please fill in all the required fields!");
                return;
            }

            try {
                if(window.RorraxyDB && window.RorraxyAddDoc) {
                    await window.RorraxyAddDoc(window.RorraxyCollection(window.RorraxyDB, "rorraxy_orders"), {
                        fullName: fullName,
                        email: email,
                        whatsapp: countryCode + " " + phone,
                        address: address,
                        cartItems: cart,
                        timestamp: new Date().toISOString()
                    });
                }
                alert("Order placed and verified successfully via Firebase!");
                localStorage.removeItem('rorraxy_cart');
                updateCartBadge();
                closeLocalYouPanel();
            } catch(e) {
                alert("Order saved locally. Firebase sync note: " + e.message);
                localStorage.removeItem('rorraxy_cart');
                updateCartBadge();
                closeLocalYouPanel();
            }
        }
