    <style>

        header.app-header { display: flex; flex-direction: column; padding: 6px 10px; align-items: center; background: var(--header-retail); position: fixed; top: 0; left: 0; z-index: 1000; backdrop-filter: blur(15px); width: 100%; border-bottom: 1px solid rgba(212,175,55,0.15); gap: 5px; }
        .header-top-bar { display: flex; justify-content: center; align-items: center; width: 100%; max-width: 600px; padding: 2px 4px; }
        .header-center-group { display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; }
        .brand-logo-img { width: 24px; height: 24px; object-fit: contain; }
        .brand-title-main { font-size: 0.85rem; font-weight: 900; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; letter-spacing: 1px; }
        .dynamic-flag-img { width: 18px; height: 12px; object-fit: cover; border-radius: 2px; }
        .header-bottom-row { display: flex; justify-content: center; width: 100%; max-width: 600px; gap: 6px; }
        .portal-btn { font-size: 0.52rem; font-weight: 700; background: #161616; border: 1px solid rgba(212,175,55,0.3); color: #fff; padding: 7px 8px; border-radius: 5px; text-transform: uppercase; cursor: pointer; flex: 1; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        .portal-btn.wholesale-btn { background: var(--gold-gradient); color: #000; border: none; font-weight: 900; }
        .portal-btn.wholesale-active { background: #161616 !important; color: var(--gold-solid) !important; border: 1px solid var(--gold-solid) !important; }

        .feed-container { padding: 12px 10px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 100%; max-width: 1400px; margin: 0 auto; }
        @media (min-width: 768px) { .feed-container { grid-template-columns: repeat(3, 1fr); padding: 20px; gap: 16px; } }

        .detail-price { font-size: 1.05rem; font-weight: 900; color: #ffffff; }

        nav.bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(12, 12, 12, 0.95); display: flex; justify-content: space-around; align-items: center; padding: 8px 4px; z-index: 6500; border-top: 1px solid rgba(212,175,55,0.15); backdrop-filter: blur(15px); }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-gray); font-size: 0.6rem; font-weight: 700; cursor: pointer; gap: 3px; position: relative; flex: 1; }
        .nav-item i { font-size: 1.15rem; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .cart-badge { position: absolute; top: -4px; right: 25%; background: #ff2a85; color: #fff; font-size: 0.5rem; font-weight: 900; width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1px solid #000; }
        
        .category-section { padding: 14px 8px; }
        .app-store-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .app-card { background: #131315; border-radius: 10px; border: 1px solid rgba(255,255,255,0.04); padding: 10px; display: flex; align-items: center; cursor: pointer; gap: 10px; }
        .app-card i { font-size: 1.2rem; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .app-card-name { font-size: 0.65rem; font-weight: 600; color: #fff; text-transform: uppercase; }
    </style>
</head>

    <script>
        let isWholesale = false, currentQty = 1, basePrice = 100.00;

        // Initialize Cart Badge on load
        window.onload = () => { updateBadge(); };

        function updateBadge() {
            let cart = JSON.parse(localStorage.getItem('rorraxy_cart')) || [];
            let total = cart.reduce((sum, item) => sum + item.qty, 0);
            document.getElementById('cartBadge').innerText = total;
        }

        // Product Details Logic
        function openProductDetails(title, price, imgs) {
            currentQty = 1; basePrice = parseFloat(price.replace('$', ''));
            document.getElementById('productQtyDisplay').innerText = currentQty;
            document.getElementById('mainDisplayMedia').src = imgs[0];
            document.getElementById('modalProductTitle').innerText = title;
            document.getElementById('modalProductPrice').innerText = price;
            
            let thumbs = '';
            imgs.forEach((img, i) => {
                thumbs += `<div class="thumb-item ${i===0?'active':''}" onclick="document.getElementById('mainDisplayMedia').src='${img}'"><img src="${img}"></div>`;
            });
            document.getElementById('thumbStrip').innerHTML = thumbs;
            document.getElementById('productDetailModal').style.display = 'block';
        }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        
        function adjustQty(amount) {
            currentQty = Math.max(1, currentQty + amount);
            document.getElementById('productQtyDisplay').innerText = currentQty;
            document.getElementById('modalProductPrice').innerText = '$' + (basePrice * currentQty).toFixed(2);
        }
        function setQtyPrice(qty, price, e) {
            currentQty = qty; basePrice = price; adjustQty(0);
            document.querySelectorAll('.tier-btn').forEach(b => b.classList.remove('active'));
            if(e) e.target.classList.add('active');
        }
        function toggleWholesaleMode() {
            isWholesale = !isWholesale;
            document.body.classList.toggle('wholesale-mode');
            const btn = document.getElementById('wholesaleToggleBtn');
            const tierBox = document.getElementById('qtyTierContainer');
            if(isWholesale) {
                btn.innerText = "Retail Mode"; btn.classList.add('wholesale-active');
                tierBox.classList.add('wholesale-mode-active');
                setQtyPrice(1, 100, null);
            } else {
                btn.innerText = "Wholesale"; btn.classList.remove('wholesale-active');
                tierBox.classList.remove('wholesale-mode-active');
                setQtyPrice(1, 100, null);
            }
        }

        // --- THE CART & YOU PANEL LOGIC ---
        
        // 1. Order Now adds to cart and opens "You" Panel
        function triggerOrderNow() {
            let title = document.getElementById('modalProductTitle').innerText;
            let priceStr = document.getElementById('modalProductPrice').innerText;
            
            let cart = JSON.parse(localStorage.getItem('rorraxy_cart')) || [];
            cart.push({ title: title, price: priceStr, qty: currentQty });
            localStorage.setItem('rorraxy_cart', JSON.stringify(cart));
            
            updateBadge();
            closeModal('productDetailModal');
            openYouPanel(); // Directly open the You panel
        }

        // 2. Render Cart inside the "You" Panel
        function renderCartInYouPanel() {
            let cart = JSON.parse(localStorage.getItem('rorraxy_cart')) || [];
            let container = document.getElementById('cartItemsContainer');
            if(cart.length === 0) {
                container.innerHTML = '<div style="color:var(--text-gray); text-align:center; font-size:0.75rem;">Your cart is empty.</div>';
                return;
            }
            let html = '', totalAmt = 0;
            cart.forEach(item => {
                let p = parseFloat(item.price.replace('$', ''));
                totalAmt += p;
                html += `
                <div style="display:flex; justify-content:space-between; background:#1a1a1a; padding:8px; border-radius:6px; margin-bottom:5px;">
                    <div><div style="font-size:0.7rem; color:#fff; font-weight:bold;">${item.title}</div>
                    <div style="font-size:0.6rem; color:var(--text-gray);">Qty: ${item.qty}</div></div>
                    <div style="font-size:0.75rem; color:var(--gold-solid); font-weight:bold;">$${p.toFixed(2)}</div>
                </div>`;
            });
            html += `<div style="display:flex; justify-content:space-between; margin-top:10px; border-top:1px solid rgba(212,175,55,0.3); padding-top:10px;">
                <strong style="font-size:0.8rem;">Total:</strong>
                <strong style="font-size:0.9rem; color:var(--gold-solid);">$${totalAmt.toFixed(2)}</strong>
            </div>`;
            container.innerHTML = html;
        }

        // 3. Open "You" Panel from nav or after ordering
        function openYouPanel() {
            renderCartInYouPanel();
            document.getElementById('localYouModal').style.display = 'block';
        }

        // Checkout Verification
        function simulateGoogleAuth() {
            document.getElementById('chkName').value = "Masudar Rahman";
            document.getElementById('chkEmail').value = "masudar.rahman@gmail.com";
        }

        async function finalizeOrder() {
            let cart = JSON.parse(localStorage.getItem('rorraxy_cart')) || [];
            if(cart.length === 0) { alert("Cart is empty!"); return; }

            let name = document.getElementById('chkName').value;
            let email = document.getElementById('chkEmail').value;
            let phone = document.getElementById('chkCode').value + " " + document.getElementById('chkPhone').value;
            let address = document.getElementById('chkAddress').value;

            if(!name || !email || !document.getElementById('chkPhone').value || !address) {
                alert("Please fill all required details."); return;
            }

            try {
                if(window.RorraxyDB && window.RorraxyAddDoc) {
                    await window.RorraxyAddDoc(window.RorraxyCollection(window.RorraxyDB, "rorraxy_orders"), {
                        customer: { name, email, phone, address },
                        items: cart,
                        date: new Date().toISOString()
                    });
                }
                alert("Order Placed Successfully!");
                localStorage.removeItem('rorraxy_cart');
                updateBadge();
                closeModal('localYouModal');
            } catch(e) {
                alert("Order placed (Firebase offline).");
                localStorage.removeItem('rorraxy_cart'); updateBadge(); closeModal('localYouModal');
            }
        }

        // Iframe functionality
        function openIframe(url) {
            document.getElementById('overlayIframe').src = url;
            document.getElementById('iframeOverlay').style.display = 'flex';
        }
        function closeIframe() {
            document.getElementById('iframeOverlay').style.display = 'none';
            document.getElementById('overlayIframe').src = '';
        }

        // Generate ALL Categories dynamically via JS to save file space and avoid truncation
        function renderCategories() {
            const cats = [
                { title: "Women's Fashion", items: ["Clothing","Handbags","Shoes","Jewelry","Watches","Lingerie","Beauty","Activewear","Traditional","Accessories"] },
                { title: "Boys' Fashion", items: ["Clothing","Shoes","Watches","Bags","Accessories"] },
                { title: "Matching Sets", items: ["Couple Sets","Family Sets","Mom & Me","Dad & Me","Sibling Sets","Team Sets","BFF Sets","Pet & Owner","Holiday Sets","Bundles"] },
                { title: "Luxury Gifts", items: ["Corporate","Luxury Items","Handicrafts","Wood Resin","Hampers"] },
                { title: "Girls' Fashion", items: ["Clothing","Shoes","Bags","Jewelry","Watches","Hair Acc","Activewear","Sleepwear","Party Dresses","Accessories"] },
                { title: "Men's Fashion", items: ["Clothing","Shoes","Watches","Grooming","Accessories"] },
                { title: "Mother & Baby", items: ["Baby Clothing","Maternity","Baby Care","Nursery Gear","Accessories"] }
            ];
            
            let html = '';
            cats.forEach(c => {
                html += `<div class="category-section"><div class="category-header-row"><h3 style="font-size:0.8rem; color:var(--gold-solid); text-transform:uppercase;">${c.title}</h3></div><div class="app-store-grid">`;
                c.items.forEach(i => {
                    html += `<div class="app-card" onclick="closeModal('categoryView')"><i class="fa-solid fa-cube"></i><span class="app-card-name">${i}</span></div>`;
                });
                html += `</div></div>`;
            });
            document.getElementById('catContent').innerHTML = html;
            document.getElementById('categoryView').style.display = 'block';
        }
    </script>
