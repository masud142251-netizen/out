<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
      const supabaseUrl = 'https://eyfecqehygiivjtbhniy.supabase.co';
      const supabaseKey = 'eyJhGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5ZmVjcWVoeWdpaXZqdGJobniyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA2NjQ0NDcsImV4cCI6MjA4NjI0MDQ0N30.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5ZmVjcWVoeWdpaXZqdGJobniyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA2NjQ0NDcsImV4cCI6MjA4NjI0MDQ0N30'; 
      const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

      window.addEventListener('DOMContentLoaded', async () => {
        const urlParams = new URLSearchParams(window.location.search);
        const affiliateId = urlParams.get('ref') || urlParams.get('aff');
        const cartParam = urlParams.get('cart');

        if(affiliateId) {
            localStorage.setItem('mme_active_aff', affiliateId);
        }

        // ইউআরএল থেকে কার্ট ডেটা পেলে শুধুমাত্র তখনই লোকালস্টোরেজ আপডেট হবে (যদি লোকালস্টোরেজ খালি থাকে)
        let existingCart = localStorage.getItem('mme_cart_items');
        if(cartParam && (!existingCart || JSON.parse(existingCart).length === 0)) {
            try {
                let decodedCart = JSON.parse(decodeURIComponent(cartParam));
                localStorage.setItem('mme_cart_items', JSON.stringify(decodedCart));
            } catch(e) {}
        }

        loadSubdomainCart();
      });

      function loadSubdomainCart() {
          let cartItems = [];
          try {
              cartItems = JSON.parse(localStorage.getItem('mme_cart_items') || '[]');
          } catch(e) {
              cartItems = [];
          }
          renderCheckoutCartSummary(cartItems);
      }

      function renderCheckoutCartSummary(items) {
        window.activeCheckoutItems = items;
        const summaryBox = document.getElementById('checkoutCartSummaryBox');
        if(!summaryBox) return;

        if(items && items.length > 0) {
            summaryBox.innerHTML = items.map((i, index) => `
                <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 0.72rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 6px;">
                    <img src="${i.image || 'https://lh3.googleusercontent.com/d/1POhz8vb-MocaPNHg-i6nDSKwV4ky16Lc'}" style="width: 36px; height: 36px; border-radius: 6px; object-fit: cover; border: 1px solid var(--gold-solid); flex-shrink: 0;">
                    <div style="flex:1; min-width:0;">
                        <div style="font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color: #fff;">${i.title || 'Product'}</div>
                        <div style="color:var(--gold-solid); display: flex; align-items: center; gap: 6px; margin-top: 2px;">
                            <span>${i.price || '$35.00'}</span>
                            <div style="display: inline-flex; align-items: center; background: rgba(255,255,255,0.1); border-radius: 4px; padding: 1px 4px;">
                                <button type="button" onclick="updateItemQuantity(${index}, -1)" style="background:none; border:none; color:#fff; cursor:pointer; font-size:0.7rem; padding:0 3px;">-</button>
                                <span style="padding: 0 4px; color:#fff; font-weight:600;">${i.quantity || 1}</span>
                                <button type="button" onclick="updateItemQuantity(${index}, 1)" style="background:none; border:none; color:#fff; cursor:pointer; font-size:0.7rem; padding:0 3px;">+</button>
                            </div>
                        </div>
                    </div>
                    <button type="button" onclick="removeSubdomainCartItem(${index})" title="Remove Item" style="background: rgba(255,59,48,0.2); border: 1px solid #ff3b30; color: #ff3b30; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.75rem; flex-shrink: 0;"><i class="fa-solid fa-xmark"></i></button>
                </div>
            `).join('');
        } else {
            summaryBox.innerHTML = `<div style="font-size:0.75rem; color:var(--text-gray); text-align:center; padding: 10px;">Your cart is empty.</div>`;
        }
      }

      function updateItemQuantity(index, change) {
          let items = window.activeCheckoutItems || [];
          if(items[index]) {
              items[index].quantity = (items[index].quantity || 1) + change;
              if(items[index].quantity <= 0) { items.splice(index, 1); }
              localStorage.setItem('mme_cart_items', JSON.stringify(items));
              renderCheckoutCartSummary(items);
          }
      }

      function removeSubdomainCartItem(index) {
          let items = window.activeCheckoutItems || [];
          items.splice(index, 1);
          localStorage.setItem('mme_cart_items', JSON.stringify(items));
          renderCheckoutCartSummary(items);
          showCustomToast("Product removed successfully");
      }
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRMASUDAR.COM - Secure Checkout</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg-black: #050505; --gold-solid: #d4af37; --text-white: #fff; --text-gray: #cfcfcf; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg-black); color: var(--text-white); padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .checkout-box { background: #121212; border: 2px solid var(--gold-solid); border-radius: 20px; width: 100%; max-width: 450px; padding: 20px; }
        .checkout-cart-summary { background: rgba(0,0,0,0.6); border: 1px solid rgba(212,175,55,0.3); border-radius: 12px; padding: 10px; margin-bottom: 15px; max-height: 200px; overflow-y: auto; }
        .auth-submit-btn { width: 100%; background: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728); border: none; padding: 12px; border-radius: 10px; color: #000; font-weight: 800; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
        .custom-toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #121212; border: 1px solid var(--gold-solid); color: var(--gold-solid); padding: 8px 16px; border-radius: 20px; font-size: 0.75rem; display: none; z-index: 9999; }
    </style>
</head>
<body>
    <div class="custom-toast" id="customToast">Action completed successfully!</div>
    <div class="checkout-box">
        <h3 style="font-family:'Cinzel',serif; color:var(--gold-solid); text-align:center; margin-bottom:15px;">Secure Checkout Hub</h3>
        <div class="checkout-cart-summary" id="checkoutCartSummaryBox">
            <div style="font-size:0.75rem; color:var(--text-gray); text-align:center;">Loading cart...</div>
        </div>
        <button class="auth-submit-btn" onclick="window.location.href='https://mrmasudar.com'">Return to Home</button>
    </div>
    <script>
        function showCustomToast(msg) {
            let t = document.getElementById('customToast');
            t.innerText = msg; t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 2000);
        }
    </script>
</body>
</html>
