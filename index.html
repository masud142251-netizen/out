<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RORRAXY - LUXURY GLOBAL ECOSYSTEM</title>
    
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1qyOXxZ8s2cJMEo66NDE4BdoxiC4hy_sG">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-retail: #000000;
            --card-retail: #111111;
            --header-retail: rgba(12, 12, 12, 0.95);
            --footer-retail: rgba(12, 12, 12, 0.95);
            --royal-blue-gradient: radial-gradient(circle at center, #1856c8 0%, #0b3fa8 50%, #031d5c 100%);
            --card-wholesale: rgba(11, 45, 110, 0.45);
            --header-wholesale: rgba(3, 29, 92, 0.95);
            --footer-wholesale: rgba(3, 29, 92, 0.98);
            --gold-gradient: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            --gold-solid: #d4af37;
            --pink-love: #ff2a85;
            --pink-discount: #ff2a85;
            --text-white: #ffffff;
            --text-gray: #b0b0b0;
            --font-luxury: 'Cinzel', serif;
            --font-main: 'Poppins', sans-serif;
        }

        html, body { 
            width: 100%; max-width: 100%; overflow-x: hidden; 
            background: var(--bg-retail) !important; 
            color: var(--text-white); font-family: var(--font-main); 
            min-height: 100vh; transition: background 0.4s ease;
        }
        body { padding-top: 85px; padding-bottom: 90px; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        .custom-toast { position: fixed; top: 15px; left: 50%; transform: translateX(-50%); background: rgba(12, 12, 12, 0.98); border: 1.5px solid; border-image: var(--gold-gradient) 1; color: #fcf6ba; padding: 8px 16px; border-radius: 30px; font-size: 0.75rem; font-weight: 700; z-index: 999999; display: none; box-shadow: 0 0 20px rgba(212,175,55,0.3); white-space: nowrap; }

        body.wholesale-mode { background: var(--royal-blue-gradient) !important; background-attachment: fixed !important; }
        body.wholesale-mode .product-card { background: var(--card-wholesale) !important; border-color: rgba(212, 175, 55, 0.35) !important; backdrop-filter: blur(10px); }
        body.wholesale-mode header.app-header { background: var(--header-wholesale) !important; }
        body.wholesale-mode nav.bottom-nav { background: var(--footer-wholesale) !important; }

        header.app-header {
            display: flex; flex-direction: column; padding: 6px 10px; align-items: center;
            background: var(--header-retail); position: fixed; top: 0; left: 0; z-index: 1000;
            backdrop-filter: blur(15px); width: 100%; border-bottom: 1px solid rgba(212,175,55,0.15);
            gap: 5px; transition: transform 0.3s ease-in-out, background 0.4s ease;
        }

        .header-top-bar { display: flex; justify-content: center; align-items: center; width: 100%; max-width: 600px; padding: 2px 4px; }
        .header-center-group { display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; }
        .brand-logo-img { width: 26px; height: 26px; object-fit: contain; background: transparent; }
        .brand-title-main { font-size: 0.88rem; font-weight: 900; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; letter-spacing: 1px; font-family: var(--font-luxury); }
        .dynamic-flag-img { width: 18px; height: 12px; object-fit: cover; border-radius: 2px; box-shadow: 0 1px 4px rgba(0,0,0,0.8); }

        .header-bottom-row { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 600px; gap: 6px; }
        .header-buttons-group { display: flex; align-items: center; gap: 5px; flex: 1; }
        
        .portal-btn {
            font-size: 0.52rem; font-weight: 700; background: #161616; border: 1px solid rgba(212,175,55,0.3);
            color: var(--text-white); padding: 7px 8px; border-radius: 5px; text-transform: uppercase; cursor: pointer;
            transition: 0.3s; white-space: nowrap; text-align: center; flex: 1; text-decoration: none;
            display: flex; align-items: center; justify-content: center;
        }
        @media (min-width: 768px) { .portal-btn { font-size: 0.62rem; padding: 8px 10px; } }

        .portal-btn.wholesale-btn { 
            background: var(--gold-gradient); color: #000; border: none; font-weight: 900; 
            box-shadow: 0 2px 10px rgba(212,175,55,0.4);
        }
        .portal-btn.wholesale-active { 
            background: #161616 !important; color: var(--gold-solid) !important; 
            font-weight: 900 !important; border: 1px solid var(--gold-solid) !important; 
        }
        .portal-btn:hover { border-color: var(--gold-solid); background: var(--gold-gradient); color: #000; font-weight: 800; }

        .top-basket-icon-btn {
            position: relative; cursor: pointer; width: 44px; height: 36px;
            display: flex; align-items: center; justify-content: center; background: none;
            border: none; flex-shrink: 0; transition: transform 0.2s;
        }
        .top-basket-icon-btn:hover { transform: scale(1.12); }
        .top-basket-icon-btn i {
            font-size: 1.85rem; background: var(--gold-gradient);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6));
        }
        .cart-badge-dot {
            position: absolute; top: -3px; right: -2px; background: var(--pink-discount); color: #fff;
            font-size: 0.52rem; font-weight: 900; width: 17px; height: 17px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; border: 1.5px solid #000;
        }

        @keyframes coinParabola {
            0% { transform: translate(0, 0) scale(0.6) rotate(0deg); opacity: 1; }
            40% { transform: translate(calc(var(--dx) * 0.45), -35vh) scale(1.3) rotate(180deg); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(0.4) rotate(360deg); opacity: 0; }
        }
        .flying-coin {
            position: fixed; z-index: 9999; width: 28px; height: 28px; background: var(--gold-gradient);
            border-radius: 50%; border: 2px solid #ffffff; box-shadow: 0 0 18px var(--gold-solid);
            animation: coinParabola 1.1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            display: flex; align-items: center; justify-content: center;
        }
        .flying-coin::after { content: '$'; font-size: 0.75rem; font-weight: 900; color: #000; }

        .live-chat-widget {
            position: fixed; bottom: 70px; right: 20px; z-index: 3500; cursor: grab;
            width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; background: none;
            touch-action: none; user-select: none;
        }
        .live-chat-widget i {
            font-size: 1.8rem; background: var(--gold-gradient);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.8));
        }

        .feed-container {
            padding: 12px 10px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 100%; max-width: 1400px; margin: 0 auto;
        }
        @media (min-width: 768px) { .feed-container { grid-template-columns: repeat(3, 1fr); padding: 20px; gap: 16px; } }
        @media (min-width: 1024px) { .feed-container { grid-template-columns: repeat(4, 1fr); gap: 18px; } }

        .product-card {
            background: var(--card-retail); border-radius: 12px; overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.85); display: flex; flex-direction: column; transition: 0.3s; position: relative;
            border: 1px solid rgba(212, 175, 55, 0.15);
        }
        .product-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px;
            background: var(--gold-gradient); opacity: 0.8;
        }
        .product-card:hover { transform: translateY(-4px); border-color: rgba(212, 175, 55, 0.4); }
        
        .product-media-box { position: relative; width: 100%; cursor: pointer; background: #000; overflow: hidden; aspect-ratio: 1/1; }
        .product-media-box img { width: 100%; height: 100%; display: block; object-fit: cover; transition: transform 0.4s ease; }
        
        .card-footer-actions { display: flex; justify-content: center; align-items: center; padding: 10px; background: rgba(15, 15, 15, 0.95); }
        .love-share-group { display: flex; align-items: center; gap: 20px; justify-content: center; width: 100%; }
        
        .love-action { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 0.75rem; font-weight: 700; color: var(--pink-love); }
        .love-action i { font-size: 0.95rem; background: var(--pink-love); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .love-action.gold-active i { background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .love-action.gold-active { color: var(--gold-solid); }

        .share-action-btn { display: flex; align-items: center; gap: 6px; background: none; border: none; font-size: 0.75rem; font-weight: 700; cursor: pointer; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .fullscreen-portal-view, .category-fullscreen-view, #productDetailModal, .subdomain-fullscreen-view {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: var(--bg-retail); z-index: 6000; flex-direction: column; overflow-y: auto; padding: 20px 10px 90px 10px;
        }
        .category-fullscreen-view { z-index: 4000; }
        .subdomain-fullscreen-view { z-index: 4500; }
        #productDetailModal { z-index: 5000; padding: 10px; }
        .product-details-content { padding: 4px; max-width: 440px; margin: 25px auto 0 auto; display: flex; flex-direction: column; gap: 8px; }

        .share-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 7000; justify-content: center; align-items: center; padding: 12px;
        }
        .share-modal-box, .basket-modal-box {
            background: #0c0c0c; border: 1.5px solid rgba(212,175,55,0.35); border-radius: 14px;
            width: 100%; max-width: 460px; margin: 40px auto; padding: 20px; position: relative;
            box-shadow: 0 10px 40px rgba(0,0,0,0.9);
        }

        .golden-close-btn {
            background: #141414; border: 1px solid rgba(212,175,55,0.4); width: 38px; height: 38px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.8);
            position: fixed; top: 15px; right: 15px; z-index: 99999;
        }
        .golden-close-btn i { font-size: 1.1rem; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* ঝুড়ির হুবহু ডিজাইন ও লাল ডিলিট বাটন */
        .cart-items-container {
            max-height: 220px; overflow-y: auto; margin-bottom: 12px; display: flex; flex-direction: column; gap: 8px; text-align: left;
        }
        .cart-item-row {
            background: #000; border: 1px solid rgba(212,175,55,0.25); padding: 8px 12px; border-radius: 8px;
            display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; gap: 10px;
        }
        .cart-item-img { width: 38px; height: 38px; object-fit: cover; border-radius: 6px; border: 1px solid rgba(212,175,55,0.3); background: #111; flex-shrink: 0; }
        .cart-item-info { flex: 1; min-width: 0; }
        .cart-item-info h5 { color: #fcf6ba; font-size: 0.75rem; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--font-luxury); }
        .cart-item-info p { color: var(--text-gray); font-size: 0.65rem; }
        
        .cart-item-remove {
            background: #ff3b30; border: none; color: #fff; width: 26px; height: 26px; border-radius: 50%;
            cursor: pointer; font-size: 0.75rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
            transition: 0.2s; box-shadow: 0 2px 8px rgba(255,59,48,0.4);
        }
        .cart-item-remove:hover { transform: scale(1.12); background: #e74c3c; }

        .cart-total-box {
            background: rgba(212,175,55,0.06); border: 1.5px solid rgba(212,175,55,0.3); padding: 10px 14px;
            border-radius: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem;
            font-weight: 700; margin-bottom: 15px; font-family: var(--font-luxury); color: #fff;
        }

        .google-verify-btn {
            width: 100%; background: #ffffff; color: #000; border: none; padding: 12px; border-radius: 30px;
            font-weight: 700; font-size: 0.82rem; display: flex; align-items: center; justify-content: center; gap: 8px;
            cursor: pointer; transition: 0.3s; font-family: var(--font-main); box-shadow: 0 4px 15px rgba(255,255,255,0.2);
        }
        .google-verify-btn:hover { background: #eaeaea; }

        .media-slider-container { width: 100%; position: relative; border-radius: 8px; overflow: hidden; background: #000; box-shadow: 0 4px 15px rgba(0,0,0,0.8); }
        .main-display-media { width: 100%; height: 210px; object-fit: contain; display: block; background: #000; }
        
        .thumbnail-strip { display: flex; justify-content: center; gap: 5px; padding: 4px; background: #0c0c0c; overflow-x: auto; }
        .thumb-item { width: 38px; height: 38px; border-radius: 4px; overflow: hidden; border: 1.5px solid rgba(212,175,55,0.3); cursor: pointer; flex-shrink: 0; background: transparent; }
        .thumb-item img { width: 100%; height: 100%; object-fit: cover; }
        .thumb-item.active { border-color: var(--gold-solid); }

        .price-chat-row { display: flex; justify-content: space-between; align-items: center; gap: 6px; background: #111111; padding: 8px 10px; border-radius: 6px; }
        .detail-price { font-size: 1.05rem; font-weight: 900; color: #ffffff; }
        
        .discount-badge-btn { background: var(--pink-discount); color: #fff; font-size: 0.52rem; font-weight: 800; padding: 5px 8px; border-radius: 5px; border: none; text-transform: uppercase; display: flex; align-items: center; gap: 3px; }
        .discount-flag-img { width: 15px; height: 10px; object-fit: cover; border-radius: 2px; }
        .chat-with-seller-btn { background: var(--gold-gradient); color: #000; font-size: 0.55rem; font-weight: 800; padding: 6px 10px; border-radius: 5px; border: none; text-transform: uppercase; cursor: pointer; }

        .product-title-bottom { font-size: 0.8rem; font-weight: 900; color: #ffffff; text-transform: uppercase; text-align: center; letter-spacing: 1px; font-family: var(--font-luxury); }

        .desc-size-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
        .extra-action-btn { background: #161616; border: 1px solid rgba(212,175,55,0.3); color: #fff; font-size: 0.58rem; font-weight: 700; padding: 7px; border-radius: 6px; cursor: pointer; text-align: center; text-transform: uppercase; }

        .quantity-tier-container { display: flex; flex-direction: column; gap: 6px; padding: 2px 0; }
        .wholesale-tiers-row { display: none; gap: 5px; margin-bottom: 2px; }
        .wholesale-mode-active .wholesale-tiers-row { display: grid; grid-template-columns: repeat(3, 1fr); }
        .tier-btn { background: #161616; border: 1px solid rgba(212,175,55,0.3); color: #fff; font-size: 0.45rem; font-weight: 700; padding: 6px 2px; border-radius: 6px; cursor: pointer; text-align: center; }
        .tier-btn.active { background: var(--gold-gradient); color: #000; font-weight: 900; border: none; }

        .quantity-row { display: flex; flex-direction: column; align-items: center; gap: 3px; }
        .qty-box { display: flex; align-items: center; justify-content: center; gap: 15px; width: 100%; }
        .qty-btn { background: var(--gold-gradient); border: none; color: #000; font-size: 1.1rem; font-weight: 900; cursor: pointer; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .qty-display { font-size: 1rem; font-weight: 900; color: #fff; min-width: 35px; text-align: center; }

        .add-to-cart-btn { background: var(--gold-gradient); color: #000; font-weight: 900; font-size: 0.72rem; padding: 10px; border-radius: 6px; border: none; text-transform: uppercase; cursor: pointer; width: 100%; margin-top: 2px; font-family: var(--font-luxury); }

        .search-popup-box { display: none; position: fixed; top: 75px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 520px; background: transparent; z-index: 4000; padding: 0; border: none; box-shadow: none; }
        .search-input-field-box { display: flex; align-items: center; background: #000000; border: 1px solid rgba(212,175,55,0.4); border-radius: 30px; padding: 6px 14px; gap: 10px; box-shadow: 0 8px 25px rgba(0,0,0,0.9); }
        .search-input-field-box input { background: none; border: none; outline: none; color: #fff; font-size: 0.85rem; width: 100%; }
        .search-submit-btn { background: var(--gold-gradient); border: none; color: #000; font-weight: 800; font-size: 0.65rem; padding: 5px 12px; border-radius: 20px; cursor: pointer; text-transform: uppercase; }

        .category-section { padding: 14px 8px; }
        .category-header-row { display: flex; justify-content: flex-start; align-items: center; margin-bottom: 12px; padding: 0 4px; }
        .category-title { font-size: 0.9rem; font-weight: 800; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; letter-spacing: 1px; font-family: var(--font-luxury); }
        
        .app-store-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 100%; }
        @media (min-width: 576px) { .app-store-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (min-width: 768px) { .app-store-grid { grid-template-columns: repeat(5, 1fr); gap: 12px; } }

        .app-card { background: #131315; border-radius: 10px; border: 1px solid rgba(255,255,255,0.04); padding: 14px 10px; display: flex; align-items: center; text-align: left; cursor: pointer; transition: all 0.3s; gap: 12px; min-height: 70px; }
        .app-card:hover { transform: translateY(-2px); background: #1a1a1e; border-color: rgba(212, 175, 55, 0.3); }
        .app-card-icon i { font-size: 1.3rem; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .app-card-name { font-size: 0.7rem; font-weight: 600; color: var(--text-white); text-transform: uppercase; }

        /* ড্যাশবোর্ড ও কমন ইনফো বক্স স্টাইল */
        .dashboard-box { background: #121215; border: 1px solid rgba(212,175,55,0.3); border-radius: 12px; padding: 16px; margin: 15px auto; max-width: 500px; text-align: left; box-shadow: 0 5px 20px rgba(0,0,0,0.8); }
        .dashboard-title { font-size: 0.95rem; font-weight: 900; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; font-family: var(--font-luxury); margin-bottom: 12px; border-bottom: 1px solid rgba(212,175,55,0.2); padding-bottom: 6px; }
        .dashboard-row { display: flex; justify-content: space-between; font-size: 0.75rem; padding: 6px 0; border-bottom: 1px dashed rgba(255,255,255,0.06); }
        .dashboard-row span:first-child { color: var(--text-gray); font-weight: 600; }
        .dashboard-row span:last-child { color: #fcf6ba; font-weight: 700; }

        nav.bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%; background: var(--footer-retail);
            display: flex; justify-content: space-around; align-items: center; padding: 8px 4px;
            z-index: 5000; border-top: 1px solid rgba(212,175,55,0.15); backdrop-filter: blur(15px);
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; text-decoration: none;
            color: var(--text-gray); font-size: 0.6rem; font-weight: 700; cursor: pointer; text-align: center; gap: 3px; flex: 1; transition: 0.3s;
        }
        .nav-item i { font-size: 1.15rem; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-item.active, .nav-item:hover { color: var(--gold-solid); transform: translateY(-2px); }
        .nav-item span { text-transform: uppercase; letter-spacing: 0.4px; }
    </style>
</head>
<body id="mainBody">

    <div class="custom-toast" id="customToast">Action completed successfully!</div>

    <header class="app-header" id="mainHeader">
        <div class="header-top-bar">
            <div class="header-center-group" onclick="location.reload()">
                <img src="https://lh3.googleusercontent.com/d/1qyOXxZ8s2cJMEo66NDE4BdoxiC4hy_sG" alt="Logo" class="brand-logo-img">
                <span class="brand-title-main">RORRAXY</span>
                <div class="header-country-flag-box" title="Visitor Country Flag">
                    <img id="visitorFlagImg" src="https://flagcdn.com/w80/bd.png" alt="Flag" class="dynamic-flag-img">
                </div>
            </div>
        </div>

        <div class="header-bottom-row">
            <div class="header-buttons-group">
                <button class="portal-btn" onclick="openFullScreenPortal('https://academy.rorraxy.com')">Creative Academy</button>
                <button class="portal-btn" onclick="openFullScreenPortal('https://solutions.rorraxy.com')">B2B/B2C Solution</button>
                <button class="portal-btn wholesale-btn" id="wholesaleToggleBtn" onclick="toggleRetailWholesaleMode()">Wholesale</button>
            </div>

            <div class="top-basket-icon-btn" id="topBasketIcon" onclick="openBasketModal()" title="Basket">
                <i class="fa-solid fa-basket-shopping"></i>
                <span class="cart-badge-dot" id="floatingCartCount">0</span>
            </div>
        </div>
    </header>

    <div class="live-chat-widget" id="draggableChat" onclick="openLiveChat()" title="Live Chat">
        <i class="fa-solid fa-comments"></i>
    </div>

    <!-- প্রোডাক্ট ফিড -->
    <main class="feed-container" id="productFeed">
        <div class="product-card" id="card-prod-1">
            <div class="product-media-box" onclick="openProductDetails('PREMIUM BRACELET', '$100.00', ['https://lh3.googleusercontent.com/d/1a6lFxluTSYUQjB8oqlVQYApRRSmCxEOW', 'https://lh3.googleusercontent.com/d/1qyOXxZ8s2cJMEo66NDE4BdoxiC4hy_sG'])">

            isDragging = true; startX = e.clientX; startY = e.clientY;
            const rect = dragEl.getBoundingClientRect();
            initialX = rect.left; initialY = rect.top;
            dragEl.setPointerCapture(e.pointerId);
        });
        dragEl.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            dragEl.style.left = `${initialX + (e.clientX - startX)}px`;
            dragEl.style.top = `${initialY + (e.clientY - startY)}px`;
        });
        dragEl.addEventListener('pointerup', (e) => { isDragging = false; dragEl.releasePointerCapture(e.pointerId); });

        // সার্চ পপআপ টগল সিস্টেম
        function toggleSearchPopup() {
            const popup = document.getElementById('searchPopup');
            if (popup.style.display === 'block') {
                popup.style.display = 'none';
            } else {
                document.getElementById('subdomainView').style.display = 'none';
                document.getElementById('categoryView').style.display = 'none';
                document.getElementById('basketModal').style.display = 'none';
                popup.style.display = 'block';
            }
        }

        function filterCategory(catName) {
            showToast(`Filtering: ${catName}`);
            toggleCategoryView();
        }

        function executeSearch() {
            const q = document.getElementById('searchInputField').value;
            if(q.trim()) { showToast(`Searching: "${q}"`); toggleSearchPopup(); }
        }

        function openBasketModal() {
            renderCartItems();
            document.getElementById('basketModal').style.display = 'flex';
        }
        function closeBasketModal() { document.getElementById('basketModal').style.display = 'none'; }

        function renderCartItems() {
            let cart = JSON.parse(localStorage.getItem('rorraxy_cart')) || [];
            let listContainer = document.getElementById('cartItemsList');
            let totalEl = document.getElementById('cartTotalAmt');
            
            if (cart.length === 0) {
                listContainer.innerHTML = `<p style="font-size:0.75rem; color:var(--text-gray); text-align:center; padding:15px;">Your cart is empty.</p>`;
                totalEl.innerText = "$0.00";
                return;
            }
            
            let html = '';
            let grandTotal = 0;
            cart.forEach((item, index) => {
                let numericPrice = parseFloat(item.price.replace('$', '')) * item.qty;
                grandTotal += numericPrice;
                html += `
                    <div class="cart-item-row">
                        <img src="${item.image}" alt="Product" class="cart-item-img">
                        <div class="cart-item-info">
                            <h5>${item.title}</h5>
                            <p>$${numericPrice.toFixed(2)} (${item.qty} Pcs)</p>
                        </div>
                        <button class="cart-item-remove" onclick="removeFromCart(${index})" title="Delete"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                `;
            });
            listContainer.innerHTML = html;
            totalEl.innerText = `$${grandTotal.toFixed(2)}`;
        }

        function removeFromCart(index) {
            let cart = JSON.parse(localStorage.getItem('rorraxy_cart')) || [];
            cart.splice(index, 1);
            localStorage.setItem('rorraxy_cart', JSON.stringify(cart));
            updateCartBadge();
            renderCartItems();
            showToast("Product removed");
        }

        // ঝুড়ি থেকে গুগল ভেরিফাই করে সরাসরি ইউ-ড্যাশবোর্ডে ডেটা সিঙ্ক করা
        function verifyAndOpenYouDashboard() {
            let cart = JSON.parse(localStorage.getItem('rorraxy_cart')) || [];
            if (cart.length === 0) { showToast("Cart is empty!"); return; }
            localStorage.setItem('rorraxy_google_verified', 'true');
            closeBasketModal();
            showToast("Google Verified & Order Synced!");
            setTimeout(() => { toggleSubdomainView('you'); }, 800);
        }

        function toggleRetailWholesaleMode() {
            isWholesaleMode = !isWholesaleMode;
            document.body.classList.toggle('wholesale-mode');
            const toggleBtn = document.getElementById('wholesaleToggleBtn');
            toggleBtn.innerText = isWholesaleMode ? "Retail Mode" : "Wholesale";
            toggleBtn.classList.toggle('wholesale-active', isWholesaleMode);
        }

        function adjustQuantity(amount) {
            currentQuantity += amount;
            if (currentQuantity < 1) currentQuantity = 1;
            document.getElementById('productQtyDisplay').innerText = currentQuantity;
            document.getElementById('modalProductPrice').innerText = `$${(baseUnitPrice * currentQuantity).toFixed(2)}`;
        }

        function triggerCoinAnimationAndBuyNow(event) {
            let cart = JSON.parse(localStorage.getItem('rorraxy_cart')) || [];
            cart.push({ 
                title: document.getElementById('modalProductTitle').innerText, 
                price: document.getElementById('modalProductPrice').innerText, 
                qty: currentQuantity,
                image: currentProductImage
            });
            localStorage.setItem('rorraxy_cart', JSON.stringify(cart));
            updateCartBadge();
            document.getElementById('productDetailModal').style.display = 'none';
            showToast("Added to cart & synced with You!");
        }

        function updateCartBadge() {
            let cart = JSON.parse(localStorage.getItem('rorraxy_cart')) || [];
            document.getElementById('floatingCartCount').innerText = cart.length;
        }

        function openProductDetails(title, price, images) {
            currentProductImage = images[0];
            baseUnitPrice = parseFloat(price.replace('$', ''));
            currentQuantity = 1;
            document.getElementById('productQtyDisplay').innerText = currentQuantity;
            document.getElementById('mainDisplayMedia').src = images[0];
            document.getElementById('modalProductPrice').innerText = price;
            document.getElementById('modalProductTitle').innerText = title;
            document.getElementById('productDetailModal').style.display = 'block';
        }
        function closeProductDetails() { document.getElementById('productDetailModal').style.display = 'none'; }

        function openShareModal() {
            let baseUrl = window.location.href.split('?')[0];
            document.getElementById('shareUrlInput').value = baseUrl;
            document.getElementById('shareModal').style.display = 'flex';
        }
        function closeShareModal() { document.getElementById('shareModal').style.display = 'none'; }
        function copyShareLink() {
            const inputField = document.getElementById('shareUrlInput');
            inputField.select();
            navigator.clipboard.writeText(inputField.value);
            document.getElementById('copyBtnText').innerText = "Copied!";
            setTimeout(() => { closeShareModal(); }, 2000);
        }

        window.onload = function() {
            updateCartBadge();
        };
    </script>
</body>
</html>
