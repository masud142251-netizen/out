<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RORRAXY | Creative Academy - Coming Soon</title>
    
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1PD_g_agcbmm7bbJTHoOWss8YtQ17LNsb=s400">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "YOUR_FIREBASE_API_KEY",
            authDomain: "YOUR_FIREBASE_AUTH_DOMAIN",
            projectId: "YOUR_FIREBASE_PROJECT_ID",
            storageBucket: "YOUR_FIREBASE_STORAGE_BUCKET",
            messagingSenderId: "YOUR_FIREBASE_MESSAGING_SENDER_ID",
            appId: "YOUR_FIREBASE_APP_ID"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
    </script>

    <style>
        :root {
            --bg-black: #050505;
            --surface-bg: #0c0c0c;
            --gold-gradient: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            --gold-solid: #d4af37;
            --text-white: #ffffff;
            --text-gray: #cfcfcf;
            --font-luxury: 'Cinzel', serif;
            --font-body: 'Poppins', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        html { width: 100%; background-color: var(--bg-black); }
        body { 
            width: 100%; 
            min-height: 100vh; 
            background-color: var(--bg-black); 
            color: var(--text-white); 
            font-family: var(--font-body); 
            padding-top: 55px; 
            padding-bottom: 60px; 
            overflow-x: hidden; 
            -webkit-font-smoothing: antialiased; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        h1, h2, h3, h4, .brand-title-main { font-family: var(--font-luxury); }

        /* হেডার */
        header.app-header {
            display: flex; 
            justify-content: flex-start; 
            align-items: center; 
            padding: 6px 14px;
            background: rgba(10, 10, 10, 0.98); 
            position: fixed; 
            top: 0; 
            left: 0; 
            z-index: 1000;
            backdrop-filter: blur(12px); 
            width: 100%; 
            border-bottom: 1px solid rgba(212,175,55,0.25);
        }
        .brand-container { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            text-decoration: none; 
        }
        .logo { 
            width: 34px; 
            height: 34px; 
            border-radius: 50%; 
            object-fit: contain; 
        }
        .brand-title-main { 
            font-size: 0.95rem; 
            font-weight: 900; 
            background: var(--gold-gradient); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            text-transform: uppercase; 
            letter-spacing: 1.8px; 
            white-space: nowrap; 
        }

        .custom-toast { position: fixed; top: 65px; left: 50%; transform: translateX(-50%); background: rgba(16, 16, 16, 0.98); border: 1.5px solid var(--gold-solid); color: var(--gold-solid); padding: 8px 16px; border-radius: 30px; font-size: 0.7rem; font-weight: 700; z-index: 999999; display: none; box-shadow: 0 0 15px rgba(212,175,55,0.3); }

        .main-wrapper { 
            width: 100%; 
            max-width: 650px; 
            margin: 0 auto; 
            padding: 14px; 
        }

        /* একটিমাত্র একক গোছালো কার্ড */
        .single-unified-card { 
            background: var(--surface-bg); 
            border-radius: 18px; 
            padding: 35px 24px; 
            text-align: center; 
            box-shadow: 0 12px 40px rgba(0,0,0,0.9); 
            border: 1px solid rgba(212,175,55,0.25); 
        }
        
        .coming-soon-badge {
            display: inline-block;
            background: var(--gold-gradient);
            color: #000;
            font-size: 0.68rem;
            font-weight: 900;
            padding: 5px 16px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        .hero-title { 
            font-size: 1.4rem; 
            font-weight: 900; 
            background: var(--gold-gradient); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            text-transform: uppercase; 
            margin-bottom: 10px; 
            letter-spacing: 1.2px; 
        }
        
        .hero-sub { 
            font-size: 0.8rem; 
            color: var(--text-gray); 
            line-height: 1.7; 
            margin-bottom: 25px; 
        }

        /* ভোটের অংশটি একই কার্ডের ভেতরে সুন্দরভাবে সাজানো */
        .vote-section-divider {
            width: 100%;
            height: 1px;
            background: rgba(212,175,55,0.2);
            margin: 22px 0;
        }

        .voting-title {
            font-family: var(--font-luxury);
            font-size: 1rem;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            font-weight: 900;
            margin-bottom: 6px;
        }

        .voting-desc {
            font-size: 0.75rem;
            color: var(--text-gray);
            margin-bottom: 20px;
        }

        .voting-interface {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .vote-btn {
            min-width: 120px;
            padding: 12px 20px;
            border-radius: 25px;
            font-weight: 900;
            font-size: 0.85rem;
            cursor: pointer;
            text-transform: uppercase;
            font-family: var(--font-luxury);
            transition: 0.3s;
            border: none;
        }

        .vote-yes {
            background: var(--gold-gradient);
            color: #000;
        }
        .vote-yes:hover {
            transform: scale(1.04);
        }

        .vote-no {
            background: rgba(20, 20, 20, 0.9);
            color: var(--gold-solid);
            border: 1.5px solid var(--gold-solid);
        }
        .vote-no:hover {
            background: rgba(35, 35, 35, 0.9);
            transform: scale(1.04);
        }

        .vote-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        .counter-display-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #000;
            border: 1.5px solid rgba(212,175,55,0.4);
            padding: 8px 20px;
            border-radius: 12px;
            min-width: 95px;
        }

        .counter-number {
            font-size: 1.4rem;
            font-weight: 900;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-family: var(--font-luxury);
        }

        .counter-label {
            font-size: 0.55rem;
            color: var(--text-gray);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 1px;
        }
    </style>
</head>
<body>

    <div class="custom-toast" id="customToast">Action completed successfully!</div>

    <!-- হেডার -->
    <header class="app-header">
        <a href="https://rorraxy.com" class="brand-container">
            <img src="https://lh3.googleusercontent.com/d/1PD_g_agcbmm7bbJTHoOWss8YtQ17LNsb=s400" alt="Logo" class="logo">
            <span class="brand-title-main">RORRAXY</span>
        </a>
    </header>

    <div class="main-wrapper">
        
        <!-- একটিমাত্র একক গোছালো কার্ড -->
        <div class="single-unified-card">
            <span class="coming-soon-badge">Coming Soon</span>
            <h1 class="hero-title">Creative Academy</h1>
            <p class="hero-sub">
                Empowering the future with revolutionary <strong>Win-Win Fee Courses</strong>. Learn by building cutting-edge real-world applications.
            </p>

            <div class="vote-section-divider"></div>

            <h3 class="voting-title">Community Vote</h3>
            <p class="voting-desc">Do You Support Win-Win Creative Academy?</p>
            
            <div class="voting-interface">
                <button class="vote-btn vote-yes" id="yesBtn" onclick="handleVote('yes')">
                    <i class="fa-solid fa-check"></i> Yes
                </button>
                
                <div class="counter-display-box">
                    <span class="counter-number" id="voteCounter">490</span>
                    <span class="counter-label">Votes</span>
                </div>

                <button class="vote-btn vote-no" id="noBtn" onclick="handleVote('no')">
                    <i class="fa-solid fa-xmark"></i> No
                </button>
            </div>
        </div>

    </div>

    <script>
        function showToast(msg) {
            let t = document.getElementById('customToast');
            if(!t) return;
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 2000);
        }

        // একবার ভোট দেওয়ার নিয়ম (Single Vote Validation)
        window.addEventListener('DOMContentLoaded', () => {
            const hasVoted = localStorage.getItem('rorraxy_academy_voted');
            if(hasVoted) {
                document.getElementById('yesBtn').disabled = true;
                document.getElementById('noBtn').disabled = true;
                showToast("You have already submitted your vote!");
            }
            loadVoteCount();
        });

        async function handleVote(choice) {
            if(localStorage.getItem('rorraxy_academy_voted')) {
                showToast("You can only vote once!");
                return;
            }

            const counterEl = document.getElementById('voteCounter');
            let currentVal = parseInt(counterEl.innerText);

            if(choice === 'yes') {
                currentVal += 1;
                showToast("Thank you for your 'Yes' vote!");
            } else {
                currentVal = Math.max(0, currentVal - 1);
                showToast("Your 'No' vote has been recorded.");
            }

            counterEl.innerText = currentVal;

            localStorage.setItem('rorraxy_academy_voted', choice);
            document.getElementById('yesBtn').disabled = true;
            document.getElementById('noBtn').disabled = true;

            try {
                await db.collection("academy_votes").add({
                    vote: choice,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
            } catch (error) {
                // ফায়ারবেস কানেকশন না থাকলেও লোকাল কাউন্টার ও ভ্যালিডেশন কাজ করবে
            }
        }

        async function loadVoteCount() {
            try {
                const snapshot = await db.collection("academy_votes").get();
                if(!snapshot.empty) {
                    let total = 490 + snapshot.size;
                    document.getElementById('voteCounter').innerText = total;
                }
            } catch (e) {
                // ডিফল্ট ৪৯০ দেখাবে
            }
        }
    </script>
</body>
</html>
