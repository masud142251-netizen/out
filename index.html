    <script>
      // সুপাবেস কানেকশন ইনিশিয়ালাইজেশন
      const supabaseUrl = 'https://eyfecqehygiivjtbhniy.supabase.co';
      const supabaseKey = 'eyJhGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5ZmVjcWVoeWdpaXZqdGJobml5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA2NjQ0NDcsImV4cCI6MjA4NjI0MDQ0N30.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5ZmVjcWVoeWdpaXZqdGJobml5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA2NjQ0NDcsImV4cCI6MjA4NjI0MDQ0N30'; 
      
      const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

      // পেজ লোড হওয়ার সাথে সাথে URL থেকে প্রোডাক্ট আইডি এবং অ্যাফিলিয়েট আইডি ধরে সুপাবেস থেকে তথ্য নিয়ে আসার ফাংশন
      window.addEventListener('DOMContentLoaded', async () => {
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('product_id') || urlParams.get('id');
        const affiliateId = urlParams.get('ref') || urlParams.get('aff');

        if(affiliateId) {
            sessionStorage.setItem('mme_active_aff', affiliateId);
            localStorage.setItem('mme_active_aff', affiliateId);
        }

        if (productId) {
          const { data, error } = await _supabase
            .from('products')
            .select('*')
            .eq('id', productId)
            .single();

          if (data) {
            console.log("Product Loaded from Supabase:", data);
            // সরাসরি সুপাবেস থেকে ডাটা নিয়ে কার্টে যুক্ত করা
            let activeAff = affiliateId || sessionStorage.getItem('mme_active_aff') || 'AFF-MASTER';
            let cartItems = JSON.parse(sessionStorage.getItem('mme_cart_items') || localStorage.getItem('mme_cart_items') || '[]');
            
            // ডুপ্লিকেট এড়াতে চেক করে যুক্ত করা
            if(!cartItems.some(i => i.productId == data.id)) {
                cartItems.push({
                    cartId: Date.now(),
                    productId: data.id,
                    title: data.title || data.name || "Exclusive Enterprise Item",
                    price: data.price || data.global || "$35.00",
                    quantity: 1,
                    color: "Standard",
                    size: "Standard",
                    sellerId: data.seller_id || 'VEN-MASUD',
                    image: data.image_url || data.imgUrl || "https://lh3.googleusercontent.com/d/1POhz8vb-MocaPNHg-i6nDSKwV4ky16Lc",
                    affiliateRef: activeAff
                });
                sessionStorage.setItem('mme_cart_items', JSON.stringify(cartItems));
                localStorage.setItem('mme_cart_items', JSON.stringify(cartItems));
            }
          } else {
            console.error("Product not found in Supabase:", error);
          }
        }
        
        // কার্ট কাউন্ট আপডেট
        updateCartCountDisplay();
      });
    </script>

    <!-- LOGIC SCRIPT -->
    <script>
        let cartItems = [];
        let activeAffiliateId = sessionStorage.getItem('mme_active_aff') || localStorage.getItem('mme_active_aff') || 'AFF-MASTER';

        window.addEventListener('DOMContentLoaded', () => {
            let savedCart = sessionStorage.getItem('mme_cart_items') || localStorage.getItem('mme_cart_items');
            if(savedCart) {
                cartItems = JSON.parse(savedCart);
                renderCartItemsList();
            }
        });

        function showCustomToast(msg) {
            let toast = document.getElementById('customToast');
            toast.innerText = msg;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 2500);
        }

        function updateCartCountDisplay() {
            // সাবডোমেনে ফর্ম পেজ বিধায় ব্যাজ রেন্ডার করার প্রয়োজন নেই
        }

        function renderCartItemsList() {
            const container = document.getElementById('checkoutItemList');
            if(!cartItems || cartItems.length === 0) {
                container.innerHTML = `<div style="text-align: center; color: var(--text-gray); font-size: 0.75rem; padding: 15px;">Your cart is empty.</div>`;
                return;
            }

            let totalAmount = 0;
            container.innerHTML = cartItems.map(item => {
                let cleanPrice = parseFloat(String(item.price).replace(/[^0-9.]/g, '')) || 0;
                let subTotal = cleanPrice * item.quantity;
                totalAmount += subTotal;
                return `
                    <div class="checkout-item-row" id="cart-row-${item.cartId}">
                        <img src="${item.image || 'https://lh3.googleusercontent.com/d/1POhz8vb-MocaPNHg-i6nDSKwV4ky16Lc'}" alt="Product">
                        <div style="flex:1; margin-left:8px; overflow:hidden;">
                            <strong style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block;">${item.title}</strong>
                            <span style="color:var(--gold-solid);">${item.price}</span> (Qty: ${item.quantity}) | Size: ${item.size || 'Standard'}
                        </div>
                        <button type="button" class="delete-cart-item-btn" onclick="removeCartItem(${item.cartId})" title="Remove">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                `;
            }).join('') + `<div style="text-align:right; font-weight:bold; color:var(--gold-solid); margin-top:8px; font-size:0.8rem;">Total Amount: $${totalAmount.toFixed(2)}</div>`;
        }

        function removeCartItem(cartId) {
            cartItems = cartItems.filter(item => item.cartId !== cartId);
            sessionStorage.setItem('mme_cart_items', JSON.stringify(cartItems));
            localStorage.setItem('mme_cart_items', JSON.stringify(cartItems));

            if(cartItems.length === 0) {
                renderCartItemsList();
                showCustomToast("Your cart is now empty.");
            } else {
                renderCartItemsList();
            }
        }

        function autoFillCustomerData() {
            let emailKey = document.getElementById('custEmail').value.trim();
            if(!emailKey) return;
            let cachedUser = sessionStorage.getItem(`mme_user_${emailKey}`) || localStorage.getItem(`mme_user_${emailKey}`);
            if(cachedUser) {
                try {
                    let data = JSON.parse(cachedUser);
                    document.getElementById('custName').value = data.name || '';
                    document.getElementById('custAddress').value = data.address || '';
                    document.getElementById('custCity').value = data.city || '';
                    if(data.phone) document.getElementById('custPhoneNum').value = data.phone || '';
                } catch(e) {}
            }
        }

        function syncCountryCodeWithDropdown(selectedCountryName) {
            let countryToDialCode = {
                "Afghanistan": "+93", "Australia": "+61", "Bangladesh": "+880", "Canada": "+1",
                "China": "+86", "Germany": "+49", "India": "+91", "Malaysia": "+60",
                "Saudi Arabia": "+966", "United Arab Emirates": "+971", "United Kingdom": "+44", "United States": "+1"
            };
            let matchingDialCode = countryToDialCode[selectedCountryName];
            if(matchingDialCode) {
                let phoneCodeSelect = document.getElementById('countryPhoneCode');
                for(let i = 0; i < phoneCodeSelect.options.length; i++) {
                    if(phoneCodeSelect.options[i].value === matchingDialCode) {
                        phoneCodeSelect.selectedIndex = i;
                        break;
                    }
                }
            }
        }

        // অর্ডার সাবমিশন এবং সুপাবেস সিঙ্ক
        async function handleOrderSubmit(e) {
            e.preventDefault();
            if(cartItems.length === 0) {
                showCustomToast("Your cart is empty!");
                return;
            }

            let email = document.getElementById('custEmail').value.trim();
            let code = document.getElementById('countryPhoneCode').value;
            let phoneNum = document.getElementById('custPhoneNum').value.trim();
            let phone = code + ' ' + phoneNum;
            let name = document.getElementById('custName').value.trim();
            let address = document.getElementById('custAddress').value.trim();
            let city = document.getElementById('custCity').value.trim();
            let country = document.getElementById('custCountry').value;

            let trackingId = 'MME-TRK-' + Math.floor(100000 + Math.random() * 900000);
            let nowTimestamp = new Date();
            let formattedDate = nowTimestamp.toLocaleString('en-GB', { 
                day: '2-digit', month: 'short', year: 'numeric', 
                hour: '2-digit', minute: '2-digit', second: '2-digit' 
            });

            let allMasterOrders = JSON.parse(localStorage.getItem('mme_admin_orders') || '[]');
            
            // ২০,০০০ এর ব্যাচ সিস্টেম ক্যালকুলেশন
            let totalOrderCount = allMasterOrders.length;
            let currentBatchNumber = Math.floor(totalOrderCount / 20000) + 1;
            let batchStart = ((currentBatchNumber - 1) * 20000) + 1;
            let batchEnd = currentBatchNumber * 20000;
            let batchName = `Batch-${currentBatchNumber} (${batchStart} - ${batchEnd})`;

            cartItems.forEach(item => {
                let orderRecord = {
                    trackingId: trackingId,
                    productId: item.productId || '1',
                    productTitle: item.title,
                    quantity: item.quantity,
                    price: item.price,
                    color: item.color || 'Standard',
                    size: item.size || 'Standard',
                    sellerId: item.sellerId || 'VEN-MASUD',
                    affiliateId: item.affiliateRef || activeAffiliateId,
                    customerName: name,
                    customerEmail: email,
                    customerPhone: phone,
                    deliveryAddress: `${address}, ${city}, ${country}`,
                    paymentStatus: 'Paid / Enterprise Secure',
                    deliveryStatus: 'Processing / Pending Dispatch',
                    orderDate: nowTimestamp.toISOString(),
                    formattedDate: formattedDate,
                    batchNo: batchName
                };
                allMasterOrders.push(orderRecord);

                // সুপাবেসে অর্ডার সিঙ্ক করা
                try {
                    _supabase.from('orders').insert([orderRecord]).then(({ error }) => {
                        if(error) console.log("Supabase order sync note:", error);
                    });
                } catch(err) {
                    console.log("Supabase connection error catch");
                }
            });

            localStorage.setItem('mme_admin_orders', JSON.stringify(allMasterOrders));

            let userData = { name, address, city, country, phone };
            sessionStorage.setItem(`mme_user_${email}`, JSON.stringify(userData));
            localStorage.setItem(`mme_user_${email}`, JSON.stringify(userData));

            showCustomToast(`Order Placed Successfully! [Trk: ${trackingId}]`);
            
            sessionStorage.removeItem('mme_cart_items');
            localStorage.removeItem('mme_cart_items');
            cartItems = [];

            setTimeout(() => {
                window.location.href = `https://mrmasudar.com/?order=success&trk=${trackingId}`;
            }, 2500);
        }
    </script>
</body>
</html>
