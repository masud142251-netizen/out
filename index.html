<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RORRAXY | Luxury Global E-Commerce</title>
    
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1PD_g_agcbmm7bbJTHoOWss8YtQ17LNsb=s400">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-black: #020202;
            --surface-bg: #070707;
            --gold-gradient: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            --gold-solid: #d4af37;
            --text-white: #f3f3f3;
            --text-gray: #a5a5a5;
            --font-luxury: 'Cinzel', serif;
            --font-body: 'Poppins', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        html, body { 
            width: 100%; 
            min-height: 100vh; 
            background-color: var(--bg-black); 
            color: var(--text-white); 
            font-family: var(--font-body); 
            overflow-x: hidden; 
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px 10px 80px 10px;
        }

        h1, h2, h3, h4 { font-family: var(--font-luxury); }

        .custom-toast { position: fixed; top: 15px; left: 50%; transform: translateX(-50%); background: rgba(12, 12, 12, 0.98); border: 1.5px solid; border-image: var(--gold-gradient) 1; color: #fcf6ba; padding: 8px 16px; border-radius: 30px; font-size: 0.75rem; font-weight: 700; z-index: 999999; display: none; box-shadow: 0 0 20px rgba(212,175,55,0.3); white-space: nowrap; }

        .page-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* প্রোডাক্ট ফিড সেকশন (স্যাম্পল শপিং আইটেম) */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
        }

        .product-card {
            background: var(--surface-bg);
            border: 1.5px solid rgba(212,175,55,0.2);
            border-radius: 14px;
            padding: 12px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 8px;
            background: #000;
        }

        .product-name {
            font-size: 0.78rem;
            font-weight: 700;
            color: #fcf6ba;
            margin-bottom: 4px;
            font-family: var(--font-luxury);
        }

        .product-price {
            font-size: 0.85rem;
            font-weight: 900;
            color: #fff;
            margin-bottom: 10px;
        }

        .order-now-btn {
            background: var(--gold-gradient);
            border: none;
            color: #000;
            font-weight: 900;
            font-size: 0.7rem;
            padding: 8px;
            border-radius: 20px;
            cursor: pointer;
            text-transform: uppercase;
            width: 100%;
            box-shadow: 0 4px 15px rgba(212,175,55,0.25);
            transition: 0.2s;
        }
        .order-now-btn:active { transform: scale(0.95); }

        /* কয়েন অ্যানিমেশন স্টাইল */
        .flying-coin {
            position: fixed;
            width: 24px;
            height: 24px;
            background: var(--gold-gradient);
            border-radius: 50%;
            z-index: 99999;
            pointer-events: none;
            box-shadow: 0 0 15px #fcf6ba;
            transition: all 0.8s cubic-bezier(0.15, 0.85, 0.35, 1.2);
        }

        /* ড্যাশবোর্ড ও 'YOU' সেকশন (হোমপেজের ভেতরেই সংযুক্ত) */
        .dashboard-card {
            background: var(--surface-bg);
            border-radius: 18px;
            padding: 18px 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
            border: 1.5px solid rgba(212,175,55,0.3);
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .home-top-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .home-left-info {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .home-logo { width: 45px; height: 45px; object-fit: contain; margin-bottom: 4px; }
        .home-brand-name { font-size: 0.8rem; font-weight: 900; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; letter-spacing: 1px; font-family: var(--font-luxury); }
        .home-username { font-size: 0.92rem; font-weight: 700; color: var(--text-white); margin-top: 2px; }
        .home-affiliate-id { font-size: 0.65rem; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 700; margin-top: 1px; }

        /* বাস্কেট / কার্ট লিস্ট সেকশন (You Section) */
        .basket-section {
            background: #040404;
            border: 1.5px solid rgba(212,175,55,0.25);
            border-radius: 12px;
            padding: 12px;
        }

        .basket-title {
            font-size: 0.8rem;
            font-weight: 800;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            margin-bottom: 8px;
            font-family: var(--font-luxury);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-items-container {
            max-height: 160px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 8px;
        }

        .cart-item-row {
            background: #000;
            border: 1px solid rgba(212,175,55,0.15);
            padding: 6px 10px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.72rem;
        }

        .cart-item-remove {
            background: none;
            border: none;
            color: #e74c3c;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .cart-total-box {
            background: rgba(212,175,55,0.06);
            border: 1px solid rgba(212,175,55,0.3);
            padding: 8px 12px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.78rem;
            font-weight: 700;
            font-family: var(--font-luxury);
            color: #fcf6ba;
            margin-bottom: 10px;
        }

        .google-verify-btn {
            width: 100%;
            background: #ffffff;
            color: #000;
            border: none;
            padding: 10px;
            border-radius: 25px;
            font-weight: 700;
            font-size: 0.78rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            font-family: var(--font-body);
        }

        /* বটম ন্যাভবার */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; width: 100%;
            background: rgba(7, 7, 7, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(212,175,55,0.2);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
        }
        .nav-item {
            background: none; border: none; color: var(--text-gray);
            font-size: 0.65rem; font-weight: 700; display: flex; flex-direction: column;
            align-items: center; gap: 3px; cursor: pointer; text-transform: uppercase;
        }
        .nav-item i { font-size: 1.1rem; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-item.active { color: #fcf6ba; }
    </style>
</head>
<body>

    <div class="custom-toast" id="customToast">Item added to basket successfully!</div>

    <div class="page-container">
        
        <!-- ১. প্রোডাক্ট ক্যাটালগ (হোমপেজ ফিড) -->
        <div class="dashboard-card">
            <h3 style="font-size: 0.9rem; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; margin-bottom: 8px;">Featured Luxury Collections</h3>
            <div class="products-grid">
                
                <div class="product-card" id="prod-1">
                    <img src="https://lh3.googleusercontent.com/d/1a6lFxluTSYUQjB8oqlVQYApRRSmCxEOW" alt="Product" class="product-img">
                    <div class="product-name">Luxury Gamar Table</div>
                    <div class="product-price">$120.00</div>
                    <button class="order-now-btn" onclick="addToCartWithCoin(event, 'Luxury Gamar Table', 120.00, 'prod-1')">Order Now</button>
                </div>

                <div class="product-card" id="prod-2">
                    <img src="https://lh3.googleusercontent.com/d/1PD_g_agcbmm7bbJTHoOWss8YtQ17LNsb=s400" alt="Product" class="product-img">
                    <div class="product-name">Baby Cotton Set</div>
                    <div class="product-price">$35.00</div>
                    <button class="order-now-btn" onclick="addToCartWithCoin(event, 'Baby Cotton Set', 35.00, 'prod-2')">Order Now</button>
                </div>

            </div>
        </div>

        <!-- ২. হোমপেজের ভেতরেই 'YOU' বাস্কেট ও অ্যাকাউন্ট সেকশন -->
        <div class="dashboard-card" id="youSection">
            <div class="home-top-section">
                <div class="home-left-info">
                    <img src="https://lh3.googleusercontent.com/d/1PD_g_agcbmm7bbJTHoOWss8YtQ17LNsb=s400" alt="Logo" class="home-logo">
                    <div class="home-brand-name">RORRAXY - YOU PROFILE</div>
                    <div class="home-username" id="homeDispName">Masudar Rahman</div>
                    <div class="home-affiliate-id" id="homeAffId">YOU ID: masudar</div>
                </div>
            </div>

            <!-- ঝুড়ি বা বাস্কেট লিস্ট -->
            <div class="basket-section">
                <div class="basket-title">
                    <span><i class="fa-solid fa-basket-shopping"></i> My Basket / Cart</span>
                    <span id="cartCountBadge" style="font-size:0.7rem; color:#fff;">2 items</span>
                </div>
                
                <div class="cart-items-container" id="cartItemsList">
                    <!-- ডাইনামিক কার্ট আইটেম এখানে লোড হবে -->
                </div>

                <div class="cart-total-box" id="basketTarget">
                    <span>Total Amount:</span>
                    <span id="cartTotalAmt">$155.00</span>
                </div>

                <button class="google-verify-btn" onclick="showToast('Proceeding to secure checkout...')">
                    <i class="fa-brands fa-google" style="color:#ea4335;"></i> Verify & Checkout with Google
                </button>
            </div>
        </div>

    </div>

    <!-- বটম ন্যাভবার -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="window.scrollTo({top:0, behavior:'smooth'})">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </button>
        <button class="nav-item" onclick="document.getElementById('youSection').scrollIntoView({behavior:'smooth'})">
            <i class="fa-solid fa-user-shield"></i>
            <span>You</span>
        </button>
        <button class="nav-item" onclick="showToast('Opening Categories...')">
            <i class="fa-solid fa-border-all"></i>
            <span>Category</span>
        </button>
        <button class="nav-item" onclick="showToast('Opening Search...')">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span>Search</span>
        </button>
    </nav>

    <script>
        // ডিফল্ট কার্ট ডাটা
        let cartItems = [
            { name: "Luxury Gamar Table", price: 120.00, qty: 1 },
            { name: "Baby Cotton Set", price: 35.00, qty: 1 }
        ];

        function renderCart() {
            const container = document.getElementById('cartItemsList');
            if(!container) return;
            
            if(cartItems.length === 0) {
                container.innerHTML = `<div style="text-align:center; color:var(--text-gray); font-size:0.72rem; padding: 10px;">Your basket is empty</div>`;
                document.getElementById('cartTotalAmt').innerText = "$0.00";
                document.getElementById('cartCountBadge').innerText = "0 items";
                return;
            }

            let html = "";
            let total = 0;
            cartItems.forEach((item, index) => {
                total += item.price * item.qty;
                html += `
                    <div class="cart-item-row">
                        <div>
                            <strong>${item.name}</strong><br>
                            <span style="color:var(--text-gray);">$${item.price.toFixed(2)} x ${item.qty}</span>
                        </div>
                        <button class="cart-item-remove" onclick="removeCartItem(${index})"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
            });
            container.innerHTML = html;
            document.getElementById('cartTotalAmt').innerText = "$" + total.toFixed(2);
            document.getElementById('cartCountBadge').innerText = cartItems.length + " items";
        }

        function removeCartItem(index) {
            cartItems.splice(index, 1);
            renderCart();
            showToast("Item removed from basket");
        }

        // কয়েন বা আইটেম ফ্লাইং অ্যানিমেশন সহ কার্টে এড করার ফাংশন
        function addToCartWithCoin(event, name, price, cardId) {
            const btn = event.target;
            const btnRect = btn.getBoundingClientRect();
            const targetEl = document.getElementById('basketTarget').getBoundingClientRect();

            // কয়েন এলিমেন্ট তৈরি
            let coin = document.createElement('div');
            coin.className = 'flying-coin';
            coin.style.left = btnRect.left + (btnRect.width / 2) - 12 + 'px';
            coin.style.top = btnRect.top + (btnRect.height / 2) - 12 + 'px';
            document.body.appendChild(coin);

            // টার্গেট পজিশনে অ্যানিমেশন পাঠানো
            setTimeout(() => {
                coin.style.left = targetEl.left + (targetEl.width / 2) - 12 + 'px';
                coin.style.top = targetEl.top + (targetEl.height / 2) - 12 + 'px';
                coin.style.transform = 'scale(0.3) rotate(360deg)';
                coin.style.opacity = '0.3';
            }, 30);

            // অ্যানিমেশন শেষে কয়েন রিমুভ করে কার্টে ডাটা যোগ করা
            setTimeout(() => {
                coin.remove();
                
                // চেক করি আইটেমটি অলরেডি আছে কিনা, থাকলে কোয়ান্টিটি বাড়াবে
                let existing = cartItems.find(i => i.name === name);
                if(existing) {
                    existing.qty += 1;
                } else {
                    cartItems.push({ name: name, price: price, qty: 1 });
                }
                renderCart();
                showToast(`"${name}" added to your You basket!`);
            }, 800);
        }

        function showToast(msg) {
            let t = document.getElementById('customToast');
            if(!t) return;
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 2000);
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderCart();
        });
    </script>
</body>
</html>
