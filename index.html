<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RORRAXY - LUXURY GLOBAL ECOSYSTEM</title>
    
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1qyOXxZ8s2cJMEo66NDE4BdoxiC4hy_sG">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-retail: #000000;
            --card-retail: #111111;
            --header-retail: rgba(12, 12, 12, 0.95);
            --footer-retail: rgba(12, 12, 12, 0.95);
            --gold-gradient: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            --gold-solid: #d4af37;
            --pink-love: #ff2a85;
            --pink-discount: #ff2a85;
            --text-white: #ffffff;
            --text-gray: #b0b0b0;
            --font-luxury: 'Cinzel', serif;
            --font-main: 'Poppins', sans-serif;
        }

        html, body { 
            width: 100%; max-width: 100%; overflow-x: hidden; 
            background: var(--bg-retail) !important; 
            color: var(--text-white); font-family: var(--font-main); 
            min-height: 100vh;
        }
        body { padding-top: 85px; padding-bottom: 90px; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        .custom-toast { position: fixed; top: 15px; left: 50%; transform: translateX(-50%); background: rgba(12, 12, 12, 0.98); border: 1.5px solid; border-image: var(--gold-gradient) 1; color: #fcf6ba; padding: 8px 16px; border-radius: 30px; font-size: 0.75rem; font-weight: 700; z-index: 999999; display: none; box-shadow: 0 0 20px rgba(212,175,55,0.3); white-space: nowrap; }

        header.app-header {
            display: flex; flex-direction: column; padding: 6px 10px; align-items: center;
            background: var(--header-retail); position: fixed; top: 0; left: 0; z-index: 1000;
            backdrop-filter: blur(15px); width: 100%; border-bottom: 1px solid rgba(212,175,55,0.15); gap: 5px;
        }

        .header-top-bar { display: flex; justify-content: center; align-items: center; width: 100%; max-width: 600px; padding: 2px 4px; }
        .header-center-group { display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; }
        .brand-logo-img { width: 26px; height: 26px; object-fit: contain; }
        .brand-title-main { font-size: 0.88rem; font-weight: 900; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; letter-spacing: 1px; font-family: var(--font-luxury); }
        .dynamic-flag-img { width: 18px; height: 12px; object-fit: cover; border-radius: 2px; box-shadow: 0 1px 4px rgba(0,0,0,0.8); }

        .header-bottom-row { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 600px; gap: 6px; }
        .header-buttons-group { display: flex; align-items: center; gap: 5px; flex: 1; }
        
        .portal-btn {
            font-size: 0.52rem; font-weight: 700; background: #161616; border: 1px solid rgba(212,175,55,0.3);
            color: var(--text-white); padding: 7px 8px; border-radius: 5px; text-transform: uppercase; cursor: pointer;
            transition: 0.3s; white-space: nowrap; text-align: center; flex: 1; text-decoration: none;
            display: flex; align-items: center; justify-content: center;
        }
        .portal-btn:hover { border-color: var(--gold-solid); background: var(--gold-gradient); color: #000; font-weight: 800; }

        .top-basket-icon-btn {
            position: relative; cursor: pointer; width: 44px; height: 36px;
            display: flex; align-items: center; justify-content: center; background: none; border: none; flex-shrink: 0;
        }
        .top-basket-icon-btn i {
            font-size: 1.85rem; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .cart-badge-dot {
            position: absolute; top: -3px; right: -2px; background: var(--pink-discount); color: #fff;
            font-size: 0.52rem; font-weight: 900; width: 17px; height: 17px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; border: 1.5px solid #000;
        }

        .feed-container {
            padding: 12px 10px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 100%; max-width: 1400px; margin: 0 auto;
        }
        @media (min-width: 768px) { .feed-container { grid-template-columns: repeat(3, 1fr); padding: 20px; gap: 16px; } }

        .product-card {
            background: var(--card-retail); border-radius: 12px; overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.85); display: flex; flex-direction: column; position: relative;
            border: 1px solid rgba(212, 175, 55, 0.15);
        }
        .product-media-box { position: relative; width: 100%; cursor: pointer; background: #000; overflow: hidden; aspect-ratio: 1/1; }
        .product-media-box img { width: 100%; height: 100%; display: block; object-fit: cover; }
        
        .card-footer-actions { display: flex; justify-content: center; align-items: center; padding: 10px; background: rgba(15, 15, 15, 0.95); }
        .love-share-group { display: flex; align-items: center; gap: 20px; justify-content: center; width: 100%; }
        .love-action { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 0.75rem; font-weight: 700; color: var(--pink-love); }
        .share-action-btn { display: flex; align-items: center; gap: 6px; background: none; border: none; font-size: 0.75rem; font-weight: 700; cursor: pointer; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* পপআপ ও ওভারলে ভিউ */
        .fullscreen-view, .category-fullscreen-view, .share-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: var(--bg-retail); z-index: 6000; flex-direction: column; overflow-y: auto; padding: 20px 10px 90px 10px;
        }
        .category-fullscreen-view { z-index: 4000; }
        .share-modal { z-index: 7000; justify-content: center; align-items: center; background: rgba(0,0,0,0.85); }

        .golden-close-btn {
            background: #141414; border: 1px solid rgba(212,175,55,0.4); width: 38px; height: 38px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.8);
            position: fixed; top: 15px; right: 15px; z-index: 99999;
        }
        .golden-close-btn i { font-size: 1.1rem; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .modal-box {
            background: #0c0c0c; border: 1.5px solid rgba(212,175,55,0.35); border-radius: 14px;
            width: 100%; max-width: 480px; margin: 40px auto; padding: 20px; position: relative;
            box-shadow: 0 10px 40px rgba(0,0,0,0.9); text-align: left;
        }

        .dashboard-box { background: #121215; border: 1px solid rgba(212,175,55,0.3); border-radius: 12px; padding: 16px; margin: 15px auto; max-width: 500px; text-align: left; }
        .dashboard-title { font-size: 0.95rem; font-weight: 900; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; font-family: var(--font-luxury); margin-bottom: 12px; border-bottom: 1px solid rgba(212,175,55,0.2); padding-bottom: 6px; }
        .dashboard-row { display: flex; justify-content: space-between; font-size: 0.75rem; padding: 6px 0; border-bottom: 1px dashed rgba(255,255,255,0.06); }
        .dashboard-row span:first-child { color: var(--text-gray); font-weight: 600; }
        .dashboard-row span:last-child { color: #fcf6ba; font-weight: 700; }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.65rem; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; margin-bottom: 4px; font-weight: 800; }
        .form-group input { width: 100%; background: #000; border: 1.5px solid rgba(212,175,55,0.3); padding: 10px 12px; color: #fff; border-radius: 8px; font-size: 0.82rem; outline: none; }
        
        .btn-gold { background: var(--gold-gradient); border: none; padding: 12px; border-radius: 25px; color: #000; font-weight: 900; font-size: 0.78rem; cursor: pointer; text-transform: uppercase; font-family: var(--font-luxury); width: 100%; text-align: center; }

        /* বটম ন্যাভবার */
        nav.bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%; background: var(--footer-retail);
            display: flex; justify-content: space-around; align-items: center; padding: 8px 4px;
            z-index: 5000; border-top: 1px solid rgba(212,175,55,0.15); backdrop-filter: blur(15px);
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; text-decoration: none;
            color: var(--text-gray); font-size: 0.6rem; font-weight: 700; cursor: pointer; text-align: center; gap: 3px; flex: 1; transition: 0.3s;
        }
        .nav-item i { font-size: 1.15rem; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-item.active, .nav-item:hover { color: var(--gold-solid); transform: translateY(-2px); }
        .nav-item span { text-transform: uppercase; }

        .category-section { padding: 14px 8px; }
        .category-header-row { display: flex; justify-content: flex-start; align-items: center; margin-bottom: 12px; padding: 0 4px; }
        .category-title { font-size: 0.9rem; font-weight: 800; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; font-family: var(--font-luxury); }
        .app-store-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 100%; }
        @media (min-width: 576px) { .app-store-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (min-width: 768px) { .app-store-grid { grid-template-columns: repeat(5, 1fr); gap: 12px; } }
        .app-card { background: #131315; border-radius: 10px; border: 1px solid rgba(255,255,255,0.04); padding: 14px 10px; display: flex; align-items: center; cursor: pointer; gap: 12px; min-height: 70px; }
        .app-card-icon i { font-size: 1.3rem; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .app-card-name { font-size: 0.7rem; font-weight: 600; color: var(--text-white); text-transform: uppercase; }
    </style>
</head>
<body id="mainBody">

    <div class="custom-toast" id="customToast">Action completed successfully!</div>

    <header class="app-header" id="mainHeader">
        <div class="header-top-bar">
            <div class="header-center-group" onclick="location.reload()">
                <img src="https://lh3.googleusercontent.com/d/1qyOXxZ8s2cJMEo66NDE4BdoxiC4hy_sG" alt="Logo" class="brand-logo-img">
                <span class="brand-title-main">RORRAXY</span>
                <img id="visitorFlagImg" src="https://flagcdn.com/w80/bd.png" alt="Flag" class="dynamic-flag-img">
            </div>
        </div>

        <div class="header-bottom-row">
            <div class="header-buttons-group">
                <button class="portal-btn" onclick="openPortalUrl('https://academy.rorraxy.com')">Creative Academy</button>
                <button class="portal-btn" onclick="openPortalUrl('https://solutions.rorraxy.com')">B2B/B2C Solution</button>
            </div>
            <div class="top-basket-icon-btn" onclick="openBasketModal()" title="Basket">
                <i class="fa-solid fa-basket-shopping"></i>
                <span class="cart-badge-dot" id="floatingCartCount">0</span>
            </div>
        </div>
    </header>

    <!-- হোমপেজ প্রোডাক্ট ফিড -->
    <main class="feed-container" id="productFeed">
        <div class="product-card">
            <div class="product-media-box">
                <img src="https://lh3.googleusercontent.com/d/1a6lFxluTSYUQjB8oqlVQYApRRSmCxEOW" alt="Product">
            </div>
            <div class="card-footer-actions">
                <div class="love-share-group">
                    <div class="love-action" onclick="toggleLove(this)"><i class="fa-solid fa-heart"></i> <span class="love-count">142</span></div>
                    <button class="share-action-btn" onclick="openShareModal()"><i class="fa-solid fa-share-nodes"></i> Share</button>
                </div>
            </div>
        </div>
    </main>

    <!-- প্যানেল ভিউ (Affiliate, Seller, You) -->
    <div id="subdomainView" class="fullscreen-view">
        <div class="golden-close-btn" onclick="toggleSubdomainView('')"><i class="fa-solid fa-xmark"></i></div>
        <div style="margin-bottom: 25px; text-align: center;">
            <span id="subdomainViewTitle" style="font-size:1.1rem; font-weight:900; background:var(--gold-gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent; text-transform:uppercase; font-family: var(--font-luxury);">Portal</span>
        </div>
        <div id="dynamicSubdomainContent"></div>
    </div>

    <!-- ক্যাটাগরি ওভারলে (সমস্ত ৭টি ক্যাটাগরির ডেটাসহ হোমপেজে কানেক্টেড) -->
    <div id="categoryView" class="category-fullscreen-view">
        <div class="golden-close-btn" onclick="toggleCategoryView()"><i class="fa-solid fa-xmark"></i></div>
        <div style="margin-bottom: 25px; text-align: center;">
            <span style="font-size:1.1rem; font-weight:900; background:var(--gold-gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent; text-transform:uppercase; font-family: var(--font-luxury);">Categories</span>
        </div>
        <div id="dynamicCategoryContent"></div>
    </div>

    <!-- ঝুড়ি এবং চেকআউট মোডাল -->
    <div id="basketModal" class="share-modal">
        <div class="modal-box">
            <div class="golden-close-btn" onclick="closeBasketModal()"><i class="fa-solid fa-xmark"></i></div>
            <h2 style="font-size: 1rem; font-weight: 900; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; font-family: var(--font-luxury); text-align:center; margin-bottom:15px;">Shopping Cart</h2>
            <div id="cartItemsList" style="max-height: 200px; overflow-y: auto; margin-bottom: 12px;"></div>
            <button class="btn-gold" onclick="verifyAndCheckout()">Continue & Verify Google</button>
        </div>
    </div>

    <!-- শেয়ার মোডাল -->
    <div id="shareModal" class="share-modal">
        <div class="modal-box">
            <div class="golden-close-btn" onclick="closeShareModal()"><i class="fa-solid fa-xmark"></i></div>
            <h3 style="font-size:0.8rem; background:var(--gold-gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent; text-transform:uppercase; font-family:var(--font-luxury); margin-bottom:10px;">Share Product</h3>
            <input type="text" id="shareUrlInput" style="width:100%; background:#000; border:1px solid rgba(212,175,55,0.4); padding:8px; color:#fff; border-radius:6px; font-size:0.7rem;" readonly value="">
        </div>
    </div>

    <!-- বটম ন্যাভবার -->
    <nav class="bottom-nav">
        <div class="nav-item" onclick="toggleSubdomainView('affiliate')">
            <i class="fa-solid fa-handshake"></i>
            <span>Affiliate</span>
        </div>
        <div class="nav-item" onclick="toggleSubdomainView('seller')">
            <i class="fa-solid fa-chart-line"></i>
            <span>Seller</span>
        </div>
        <div class="nav-item" onclick="toggleSubdomainView('you')">
            <i class="fa-solid fa-user-shield"></i>
            <span>You</span>
        </div>
        <div class="nav-item" onclick="toggleCategoryView()">
            <i class="fa-solid fa-border-all"></i>
            <span>Category</span>
        </div>
        <div class="nav-item" onclick="toggleSubdomainView('search')">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span>Search</span>
        </div>
    </nav>

    <script>
        let activeSubdomainType = "";

        function showToast(msg) {
            let t = document.getElementById('customToast');
            if(!t) return;
            t.innerText = msg; t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 2000);
        }

        function openPortalUrl(url) {
            window.open(url, '_blank');
        }

        // সেলার ও অ্যাফিলিয়েটের পারস্পরিক এক্সক্লুসিভ চেকিং (যে সেলার সে অ্যাফিলিয়েট হতে পারবে না)
        function toggleSubdomainView(type) {
            const view = document.getElementById('subdomainView');
            if (view.style.display === 'flex' && activeSubdomainType === type) {
                view.style.display = 'none';
                activeSubdomainType = "";
                return;
            }

            document.getElementById('categoryView').style.display = 'none';
            document.getElementById('basketModal').style.display = 'none';

            activeSubdomainType = type;
            const titleEl = document.getElementById('subdomainViewTitle');
            const container = document.getElementById('dynamicSubdomainContent');

            let userRole = localStorage.getItem('rorraxy_user_role') || ''; // 'seller' or 'affiliate'
            let sharedUserEmail = localStorage.getItem('rorraxy_email') || 'masudar.rahman@gmail.com';
            let sharedUserName = localStorage.getItem('rorraxy_name') || 'Masudar Rahman';

            if (type === 'affiliate') {
                if(userRole === 'seller') {
                    showToast("Access Denied: You are registered as a Seller!");
                    view.style.display = 'none';
                    return;
                }
                localStorage.setItem('rorraxy_user_role', 'affiliate');
                titleEl.innerText = "Affiliate Center";
                container.innerHTML = `
                    <div class="dashboard-box">
                        <div class="dashboard-title">Affiliate Account</div>
                        <div class="dashboard-row"><span>ID:</span><span>AFF-999M</span></div>
                        <div class="dashboard-row"><span>Name:</span><span>${sharedUserName}</span></div>
                        <div class="dashboard-row"><span>Gmail:</span><span>${sharedUserEmail}</span></div>
                        <div class="dashboard-row"><span>Commission:</span><span>$450.00</span></div>
                    </div>
                `;
            } else if (type === 'seller') {
                if(userRole === 'affiliate') {
                    showToast("Access Denied: You are registered as an Affiliate!");
                    view.style.display = 'none';
                    return;
                }
                localStorage.setItem('rorraxy_user_role', 'seller');
                titleEl.innerText = "Seller Center Hub";
                container.innerHTML = `
                    <div class="dashboard-box">
                        <div class="dashboard-title">Seller Hub & Store</div>
                        <div class="dashboard-row"><span>Seller ID:</span><span>SEL-777X</span></div>
                        <div class="dashboard-row"><span>Store Name:</span><span>${sharedUserName} Store</span></div>
                        <div class="dashboard-row"><span>Verified Gmail:</span><span>${sharedUserEmail}</span></div>
                        <div class="dashboard-row"><span>Status:</span><span style="color:#2ecc71;">Active</span></div>
                    </div>
                `;
            } else if (type === 'you') {
                titleEl.innerText = "Customer Dashboard";
                container.innerHTML = `
                    <div class="dashboard-box">
                        <div class="dashboard-title">Customer Profile</div>
                        <div class="dashboard-row"><span>Customer ID:</span><span>CUST-101M</span></div>
                        <div class="dashboard-row"><span>Name:</span><span>${sharedUserName}</span></div>
                        <div class="dashboard-row"><span>Gmail:</span><span>${sharedUserEmail}</span></div>
                    </div>
                `;
            } else if (type === 'search') {
                titleEl.innerText = "Search Collections";
                container.innerHTML = `
                    <div class="dashboard-box">
                        <div class="form-group">
                            <label>Search Rorraxy</label>
                            <input type="text" placeholder="Type keywords..." oninput="showToast('Searching...')">
                        </div>
                    </div>
                `;
            }

            view.style.display = 'flex';
        }

        // ক্যাটাগরি ওভারলে (সমস্ত ৭টি ক্যাটাগরি ও সাব-ক্যাটাগরি হোমপেজের সাথে যুক্ত)
        function toggleCategoryView() {
            const view = document.getElementById('categoryView');
            if (view.style.display === 'block') {
                view.style.display = 'none';
            } else {
                document.getElementById('subdomainView').style.display = 'none';
                const container = document.getElementById('dynamicCategoryContent');
                
                container.innerHTML = `
                    <section class="category-section">
                        <div class="category-header-row"><h2 class="category-title">1. Women's Fashion</h2></div>
                        <div class="app-store-grid">
                            <div class="app-card" onclick="filterCategory('Clothing')"><div class="app-card-icon"><i class="fa-solid fa-shirt"></i></div><span class="app-card-name">Clothing</span></div>
                            <div class="app-card" onclick="filterCategory('Handbags')"><div class="app-card-icon"><i class="fa-solid fa-bag-shopping"></i></div><span class="app-card-name">Handbags</span></div>
                            <div class="app-card" onclick="filterCategory('Shoes')"><div class="app-card-icon"><i class="fa-solid fa-shoe-prints"></i></div><span class="app-card-name">Shoes</span></div>
                            <div class="app-card" onclick="filterCategory('Jewelry')"><div class="app-card-icon"><i class="fa-solid fa-gem"></i></div><span class="app-card-name">Jewelry</span></div>
                            <div class="app-card" onclick="filterCategory('Watches')"><div class="app-card-icon"><i class="fa-solid fa-clock"></i></div><span class="app-card-name">Watches</span></div>
                        </div>
                    </section>
                    <section class="category-section">
                        <div class="category-header-row"><h2 class="category-title">2. Boys' Fashion</h2></div>
                        <div class="app-store-grid">
                            <div class="app-card" onclick="filterCategory('Boys Clothing')"><div class="app-card-icon"><i class="fa-solid fa-child"></i></div><span class="app-card-name">Clothing</span></div>
                            <div class="app-card" onclick="filterCategory('Boys Shoes')"><div class="app-card-icon"><i class="fa-solid fa-socks"></i></div><span class="app-card-name">Shoes</span></div>
                        </div>
                    </section>
                `;
                view.style.display = 'block';
            }
        }

        function filterCategory(catName) {
            showToast(`Loading: ${catName}`);
            toggleCategoryView();
        }

        function openBasketModal() {
            let cart = JSON.parse(localStorage.getItem('rorraxy_cart')) || [];
            document.getElementById('cartItemsList').innerHTML = cart.length === 0 ? `<p style="font-size:0.75rem; color:var(--text-gray); text-align:center;">Cart is empty.</p>` : `<p style="font-size:0.75rem;">${cart.length} item(s) in cart.</p>`;
            document.getElementById('basketModal').style.display = 'flex';
        }
        function closeBasketModal() { document.getElementById('basketModal').style.display = 'none'; }
        function verifyAndCheckout() {
            showToast("Google Verified & Order Placed!");
            closeBasketModal();
            setTimeout(() => { toggleSubdomainView('you'); }, 800);
        }

        function openShareModal() {
            document.getElementById('shareUrlInput').value = window.location.href;
            document.getElementById('shareModal').style.display = 'flex';
        }
        function closeShareModal() { document.getElementById('shareModal').style.display = 'none'; }
        function toggleLove(el) { el.classList.toggle('gold-active'); showToast("Liked!"); }
    </script>
</body>
</html>
