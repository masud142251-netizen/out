<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RORRAXY | Creative Academy - Coming Soon</title>
    
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1PD_g_agcbmm7bbJTHoOWss8YtQ17LNsb=s400">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "YOUR_FIREBASE_API_KEY",
            authDomain: "YOUR_FIREBASE_AUTH_DOMAIN",
            projectId: "YOUR_FIREBASE_PROJECT_ID",
            storageBucket: "YOUR_FIREBASE_STORAGE_BUCKET",
            messagingSenderId: "YOUR_FIREBASE_MESSAGING_SENDER_ID",
            appId: "YOUR_FIREBASE_APP_ID"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
    </script>

    <style>
        :root {
            --bg-black: #050505;
            --surface-bg: #0c0c0c;
            --gold-gradient: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            --gold-solid: #d4af37;
            --text-white: #ffffff;
            --text-gray: #cfcfcf;
            --font-luxury: 'Cinzel', serif;
            --font-body: 'Poppins', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        html { width: 100%; background-color: var(--bg-black); }
        body { 
            width: 100%; 
            min-height: 100vh; 
            background-color: var(--bg-black); 
            color: var(--text-white); 
            font-family: var(--font-body); 
            padding-top: 55px; 
            padding-bottom: 60px; 
            overflow-x: hidden; 
            -webkit-font-smoothing: antialiased; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        h1, h2, h3, h4, .brand-title-main { font-family: var(--font-luxury); }

        /* হেডার */
        header.app-header {
            display: flex; 
            justify-content: flex-start; 
            align-items: center; 
            padding: 6px 14px;
            background: rgba(10, 10, 10, 0.98); 
            position: fixed; 
            top: 0; 
            left: 0; 
            z-index: 1000;
            backdrop-filter: blur(12px); 
            width: 100%; 
            border-bottom: 1px solid rgba(212,175,55,0.25);
        }
        .brand-container { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            text-decoration: none; 
        }
        .logo { 
            width: 34px; 
            height: 34px; 
            border-radius: 50%; 
            object-fit: contain; 
        }
        .brand-title-main { 
            font-size: 0.95rem; 
            font-weight: 900; 
            background: var(--gold-gradient); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            text-transform: uppercase; 
            letter-spacing: 1.8px; 
            white-space: nowrap; 
        }

        .custom-toast { position: fixed; top: 65px; left: 50%; transform: translateX(-50%); background: rgba(16, 16, 16, 0.98); border: 1.5px solid var(--gold-solid); color: var(--gold-solid); padding: 8px 16px; border-radius: 30px; font-size: 0.7rem; font-weight: 700; z-index: 999999; display: none; box-shadow: 0 0 15px rgba(212,175,55,0.3); }

        .main-wrapper { 
            width: 100%; 
            max-width: 650px; 
            margin: 0 auto; 
            padding: 14px; 
        }

        /* একক গোছালো কার্ড */
        .single-unified-card { 
            background: var(--surface-bg); 
            border-radius: 18px; 
            padding: 35px 24px; 
            text-align: center; 
            box-shadow: 0 12px 40px rgba(0,0,0,0.9); 
            border: 1px solid rgba(212,175,55,0.25); 
        }
        
        .coming-soon-badge {
            display: inline-block;
            background: var(--gold-gradient);
            color: #000;
            font-size: 0.68rem;
            font-weight: 900;
            padding: 5px 16px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 14px;
        }

        .hero-title { 
            font-size: 1.45rem; 
            font-weight: 900; 
            background: var(--gold-gradient); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            text-transform: uppercase; 
            margin-bottom: 10px; 
            letter-spacing: 1.2px; 
        }
        
        .hero-sub { 
            font-size: 0.8rem; 
            color: var(--text-gray); 
            line-height: 1.7; 
            margin-bottom: 25px; 
        }

        .vote-section-divider {
            width: 100%;
            height: 1px;
            background: rgba(212,175,55,0.2);
            margin: 22px 0;
        }

        /* ভোট ইন্টারফেস (আলাদা আলাদা ইয়েস ও নো কাউন্টসহ) */
        .voting-interface {
            display: flex;
            align-items: center;
            justify-content: space-around;
            gap: 10px;
            flex-wrap: wrap;
        }

        .vote-option-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .vote-btn {
            min-width: 120px;
            padding: 12px 18px;
            border-radius: 25px;
            font-weight: 900;
            font-size: 0.82rem;
            cursor: pointer;
            text-transform: uppercase;
            font-family: var(--font-luxury);
            transition: 0.3s;
            border: none;
        }

        .vote-yes {
            background: var(--gold-gradient);
            color: #000;
            box-shadow: 0 0 10px rgba(212,175,55,0.3);
        }
        .vote-yes.active {
            box-shadow: 0 0 20px rgba(212,175,55,0.9);
            transform: scale(1.05);
        }

        .vote-no {
            background: rgba(20, 20, 20, 0.9);
            color: var(--gold-solid);
            border: 1.5px solid var(--gold-solid);
        }
        .vote-no.active {
            background: rgba(45, 45, 45, 0.9);
            box-shadow: 0 0 15px rgba(212,175,55,0.5);
            transform: scale(1.05);
        }

        /* আলাদা কাউন্টার টেক্সট (শেপ বা ব্যাকগ্রাউন্ড ছাড়া ঝকঝকে) */
        .option-counter {
            font-size: 1.5rem;
            font-weight: 900;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-family: var(--font-luxury);
        }
        .option-label {
            font-size: 0.58rem;
            color: var(--text-gray);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
    </style>
</head>
<body>

    <div class="custom-toast" id="customToast">Action completed successfully!</div>

    <!-- হেডার -->
    <header class="app-header">
        <a href="https://rorraxy.com" class="brand-container">
            <img src="https://lh3.googleusercontent.com/d/1PD_g_agcbmm7bbJTHoOWss8YtQ17LNsb=s400" alt="Logo" class="logo">
            <span class="brand-title-main">RORRAXY</span>
        </a>
    </header>

    <div class="main-wrapper">
        
        <!-- একক গোছালো কার্ড -->
        <div class="single-unified-card">
            <span class="coming-soon-badge">Coming Soon</span>
            <h1 class="hero-title">Creative Academy</h1>
            <p class="hero-sub">
                Empowering the future with revolutionary <strong>Win-Win Fee Courses</strong>. Learn by building cutting-edge real-world applications.
            </p>

            <div class="vote-section-divider"></div>

            <!-- আলাদা ইয়েস ও নো ভোট সিস্টেম -->
            <div class="voting-interface">
                <!-- হ্যাঁ ভোট গ্রুপ -->
                <div class="vote-option-group">
                    <button class="vote-btn vote-yes" id="yesBtn" onclick="handleVote('yes')">
                        <i class="fa-solid fa-check"></i> Yes
                    </button>
                    <div>
                        <span class="option-counter" id="yesCounter">450</span>
                        <div class="option-label">Yes Votes</div>
                    </div>
                </div>

                <!-- না ভোট গ্রুপ -->
                <div class="vote-option-group">
                    <button class="vote-btn vote-no" id="noBtn" onclick="handleVote('no')">
                        <i class="fa-solid fa-xmark"></i> No
                    </button>
                    <div>
                        <span class="option-counter" id="noCounter">40</span>
                        <div class="option-label">No Votes</div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        function showToast(msg) {
            let t = document.getElementById('customToast');
            if(!t) return;
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 2000);
        }

        // পেজ লোড হওয়ার সময় ইউজারের আগের ভোট চেক করা
        window.addEventListener('DOMContentLoaded', () => {
            const previousVote = localStorage.getItem('rorraxy_academy_user_vote');
            if(previousVote === 'yes') {
                document.getElementById('yesBtn').classList.add('active');
            } else if(previousVote === 'no') {
                document.getElementById('noBtn').classList.add('active');
            }
            loadVoteCounts();
        });

        // নিখুঁত ভোট ও টোগল লজিক (কেউ মতামত পরিবর্তন করলে ইয়েস থেকে কমে নো-তে যোগ হবে)
        async function handleVote(choice) {
            let previousVote = localStorage.getItem('rorraxy_academy_user_vote');

            const yesBtn = document.getElementById('yesBtn');
            const noBtn = document.getElementById('noBtn');
            const yesCounterEl = document.getElementById('yesCounter');
            const noCounterEl = document.getElementById('noCounter');

            let yesVal = parseInt(yesCounterEl.innerText);
            let noVal = parseInt(noCounterEl.innerText);

            if (previousVote === choice) {
                showToast("You have already voted for this option!");
                return;
            }

            if (previousVote === 'yes' && choice === 'no') {
                yesVal = Math.max(0, yesVal - 1);
                noVal += 1;
            } else if (previousVote === 'no' && choice === 'yes') {
                noVal = Math.max(0, noVal - 1);
                yesVal += 1;
            } else {
                if (choice === 'yes') yesVal += 1;
                else noVal += 1;
            }

            yesBtn.classList.toggle('active', choice === 'yes');
            noBtn.classList.toggle('active', choice === 'no');

            localStorage.setItem('rorraxy_academy_user_vote', choice);
            showToast(`Your '${choice.toUpperCase()}' vote has been recorded.`);

            yesCounterEl.innerText = yesVal;
            noCounterEl.innerText = noVal;

            try {
                await db.collection("academy_votes").add({
                    vote: choice,
                    previous: previousVote || 'none',
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
            } catch (error) {
                // ফায়ারবেস কানেকশন না থাকলেও লোকাল কাউন্টার পারফেক্ট কাজ করবে
            }
        }

        async function loadVoteCounts() {
            try {
                const snapshot = await db.collection("academy_votes").get();
                if(!snapshot.empty) {
                    let yesTotal = 450;
                    let noTotal = 40;
                    
                    snapshot.forEach(doc => {
                        let data = doc.data();
                        if(data.vote === 'yes') yesTotal += 1;
                        if(data.vote === 'no') noTotal += 1;
                    });

                    document.getElementById('yesCounter').innerText = yesTotal;
                    document.getElementById('noCounter').innerText = noTotal;
                }
            } catch (e) {
                // ডিফল্ট ভ্যালু দেখাবে
            }
        }
    </script>
</body>
</html>
